name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - uses: actions/checkout@v7
      - name: Allow pip to install packages
        run: printf "[install]\nbreak-system-packages = true\n" | sudo tee -a /etc/pip.conf
      - name: Install GDB for MoveGroup teardown diagnostics
        run: apt-get update && apt-get install -y --no-install-recommends gdb
      - uses: ros-tooling/action-ros-ci@0.4.8
        env:
          STAUBLI_MOVE_GROUP_GDB_PREFIX: "gdb --batch --return-child-result -ex \"set pagination off\" -ex \"handle SIGINT nostop noprint pass\" -ex run -ex \"thread apply all bt full\" --args"
        with:
          target-ros2-distro: jazzy

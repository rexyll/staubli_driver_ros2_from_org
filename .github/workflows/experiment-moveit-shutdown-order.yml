name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch MoveIt Jazzy source and apply isolated teardown-order experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()
          before_init = "  rclcpp::init(argc, argv);\n\n  rclcpp::NodeOptions opt;"
          after_init = (
              "  rclcpp::init(argc, argv);\n\n"
              "  // Experiment: destroy all MoveIt and executor locals before context shutdown.\n"
              "  {\n"
              "  rclcpp::NodeOptions opt;"
          )
          before_shutdown = (
              "    rclcpp::shutdown();\n"
              "  }\n"
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n\n"
              "  return 0;\n"
              "}"
          )
          after_shutdown = (
              "  }\n"
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n"
              "  }\n\n"
              "  rclcpp::shutdown();\n"
              "  return 0;\n"
              "}"
          )
          if source.count(before_init) != 1 or source.count(before_shutdown) != 1:
              raise SystemExit("MoveIt Jazzy source did not match the reviewed main()/shutdown layout; refusing to patch.")
          source = source.replace(before_init, after_init, 1)
          source = source.replace(before_shutdown, after_shutdown, 1)
          path.write_text(source)
          print("Applied isolated scope-order patch:")
          print("\n".join(source.splitlines()[215:345]))
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp

      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git clone --depth 1 --branch fix/mock-planning-shutdown-and-controller-gates https://github.com/rexyll/staubli_driver_ros2_from_org.git /tmp/staubli_ws/src/staubli_driver_ros2
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Run mock planning and strict teardown regression
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          cd /tmp/staubli_ws
          colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
          if-no-files-found: ignore

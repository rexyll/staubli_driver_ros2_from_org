name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git gdb python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch and build unmodified ROS 2 Jazzy rclcpp overlay (no ASan)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp")
          required = [
              root / "callback_group.cpp",
              root / "guard_condition.cpp",
              root / "executors" / "executor_notify_waitable.cpp",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Expected Jazzy rclcpp sources missing: {missing}")
          # Add CI-only lifecycle markers to the temporary rclcpp overlay.
          executor_path = root / "executor.cpp"
          executor_source = executor_path.read_text()
          if "#include <cstdio>" not in executor_source:
              executor_source = executor_source.replace(
                  "#include <cassert>\n",
                  "#include <cassert>\n#include <cstdio>\n",
                  1,
              )
          executor_begin = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          executor_begin_marked = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body BEGIN\\n\");\n"
              "  std::fflush(stderr);\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          if executor_source.count(executor_begin) != 1:
              raise SystemExit("Expected exactly one Executor destructor entry; refusing to instrument.")
          executor_source = executor_source.replace(executor_begin, executor_begin_marked, 1)
          executor_end = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "}"
          )
          executor_end_marked = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body END; WaitSet member destruction follows\\n\");\n"
              "  std::fflush(stderr);\n"
              "}"
          )
          if executor_source.count(executor_end) != 1:
              raise SystemExit("Expected exactly one Executor destructor exit; refusing to instrument.")
          executor_source = executor_source.replace(executor_end, executor_end_marked, 1)
          executor_path.write_text(executor_source)
          print("Applied CI-only Executor destructor entry/exit markers; upstream repository remains untouched.")
          PY
          rosdep install --from-paths /tmp/rclcpp_ws/src/rclcpp/rclcpp --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-select rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply controlled signal-wait and teardown-order experiment
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          # Single-variable native A/B: stop and join only the PSM scene-publishing
          # thread after executor.spin() returns, before Context shutdown and before
          # MultiThreadedExecutor destruction. Keep all other upstream MoveIt code intact.
          if source.count("  rclcpp::init(argc, argv);") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::init anchor.")
          if source.count("    executor.spin();") != 1:
              raise SystemExit("Expected exactly one upstream executor.spin anchor.")
          if source.count("    rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown anchor.")
          if "sigwait(" in source or "SignalHandlerOptions::None" in source:
              raise SystemExit("Unexpected custom signal handling in upstream baseline.")
          shutdown_anchor = "    rclcpp::shutdown();"
          if source.count(shutdown_anchor) != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown call.")
          insertion = """    RCLCPP_INFO(nh->get_logger(), "shutdown A/B: stopping PSM scene publisher before Context shutdown");
              planning_scene_monitor->stopPublishingPlanningScene();
              RCLCPP_INFO(nh->get_logger(), "shutdown A/B: PSM scene publisher stopped and joined");
          """
          source = source.replace(shutdown_anchor, insertion + shutdown_anchor, 1)
          if source.count("planning_scene_monitor->stopPublishingPlanningScene();") != 1:
              raise SystemExit("PSM publisher stop patch validation failed.")
          print("Applied one-variable A/B: explicit PSM scene publisher stop/join before Context shutdown.")

          # Targeted plugin-lifetime A/B: declare MoveGroupExe before the executor,
          # so reverse destruction destroys the executor WaitSet while capability
          # plugin instances and their plugin DSOs are still alive.
          declaration_order = """    rclcpp::executors::MultiThreadedExecutor executor;

    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);"""
          reordered_declarations = """    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);

    rclcpp::executors::MultiThreadedExecutor executor;"""
          if source.count(declaration_order) != 1:
              raise SystemExit("Expected exactly one executor/MoveGroupExe declaration pair; refusing to reorder.")
          source = source.replace(declaration_order, reordered_declarations, 1)
          if not source.index("move_group::MoveGroupExe mge") < source.index(
              "rclcpp::executors::MultiThreadedExecutor executor"
          ):
              raise SystemExit("MoveGroupExe must be declared before executor for reverse destruction order.")
          if "#include <cstdio>" not in source:
              source = source.replace("#include <memory>\n", "#include <cstdio>\n#include <memory>\n", 1)
          move_group_dtor = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    capabilities_.clear();\n"
              "    context_.reset();\n"
              "    capability_plugin_loader_.reset();\n"
              "  }"
          )
          move_group_dtor_marked = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe dtor BEGIN; capabilities=%zu loader=%d\\n\", "
              "capabilities_.size(), capability_plugin_loader_ ? 1 : 0);\n"
              "    std::fflush(stderr);\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe before capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capabilities_.clear();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    context_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after context_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capability_plugin_loader_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capability_plugin_loader_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "  }"
          )
          if source.count(move_group_dtor) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe destructor; refusing to instrument.")
          source = source.replace(move_group_dtor, move_group_dtor_marked, 1)
          path.write_text(source)
          print("Applied plugin-lifetime A/B and explicit MoveGroupExe capability/loader destructor markers.")

          if False:  # Controlled A/B: leave Jazzy TrajectoryExecutionManager teardown unmodified
            tem_path = Path(
                "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/src/"
                "trajectory_execution_manager.cpp"
            )
            tem_source = tem_path.read_text()
            tem_header_path = Path(
                "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/include/"
                "moveit/trajectory_execution_manager/trajectory_execution_manager.hpp"
            )
            tem_header_source = tem_header_path.read_text()
            callback_member_anchor = "  rclcpp::Subscription<std_msgs::msg::String>::SharedPtr event_topic_subscriber_;\n"
            if tem_header_source.count(callback_member_anchor) != 1:
                raise SystemExit("Expected one TEM event subscription member anchor; refusing to patch.")
            tem_header_source = tem_header_source.replace(
                callback_member_anchor,
                callback_member_anchor + "  rclcpp::CallbackGroup::SharedPtr event_callback_group_;\n",
                1,
            )
            tem_header_path.write_text(tem_header_source)
            group_pattern = (
                r"  auto callback_group = node_->create_callback_group\(rclcpp::CallbackGroupType::MutuallyExclusive\);\n"
                r"  auto options = rclcpp::SubscriptionOptions\(\);\n"
                r"  options.callback_group = callback_group;"
            )
            group_replacement = (
                "  event_callback_group_ = node_->create_callback_group(rclcpp::CallbackGroupType::MutuallyExclusive);\n"
                "  auto options = rclcpp::SubscriptionOptions();\n"
                "  options.callback_group = event_callback_group_;"
            )
            tem_source, group_count = re.subn(group_pattern, group_replacement, tem_source, count=1)
            if group_count != 1:
                raise SystemExit(f"Expected exactly one event callback-group anchor, found {group_count}; refusing to patch.")
  
            tem_pattern = (
                r"TrajectoryExecutionManager::~TrajectoryExecutionManager\(\)\n"
                r"\{\n"
                r"  stopExecution\(true\);\n"
                r"  if \(private_executor_\)\n"
                r"    private_executor_->cancel\(\);\n"
                r"  if \(private_executor_thread_\.joinable\(\)\)\n"
                r"    private_executor_thread_\.join\(\);\n"
                r"\}\n"
            )
            tem_replacement = (
                "TrajectoryExecutionManager::~TrajectoryExecutionManager()\n"
                "{\n"
                "  stopExecution(true);\n"
                "  if (private_executor_)\n"
                "    private_executor_->cancel();\n"
                "  if (private_executor_thread_.joinable())\n"
                "    private_executor_thread_.join();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after stop/join: main_context_valid=%d controller_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid(), "
                "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
                "  event_topic_subscriber_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after event subscription reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "  callback_handler_.reset();\n"
                "  event_callback_group_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after callback group reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "  if (private_executor_ && controller_mgr_node_)\n"
                "    private_executor_->remove_node(controller_mgr_node_);\n"
                "  private_executor_.reset();\n"
                "  controller_manager_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM before controller node reset: controller_context_valid=%d\", "
                "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
                "  controller_mgr_node_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after controller node reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "}\n"
            )
            tem_updated, tem_count = re.subn(tem_pattern, tem_replacement, tem_source, count=1)
            if tem_count != 1:
                raise SystemExit(
                    f"Expected exactly one TrajectoryExecutionManager destructor anchor, found {tem_count}; "
                    "refusing to patch."
                )
            tem_source = tem_updated
            cleanup_tokens = (
                "event_topic_subscriber_.reset();",
                "callback_handler_.reset();",
                "event_callback_group_.reset();",
                "private_executor_->remove_node(controller_mgr_node_);",
                "private_executor_.reset();",
                "controller_manager_.reset();",
                "controller_mgr_node_.reset();",
            )
            if any(tem_source.count(token) != 1 for token in cleanup_tokens):
                raise SystemExit("Internal controller-manager cleanup validation failed.")
            if not (
                tem_source.index("private_executor_thread_.join();")
                < tem_source.index("event_topic_subscriber_.reset();")
                < tem_source.index("callback_handler_.reset();")
                < tem_source.index("event_callback_group_.reset();")
                < tem_source.index("private_executor_->remove_node(controller_mgr_node_);")
                < tem_source.index("private_executor_.reset();")
                < tem_source.index("controller_manager_.reset();")
                < tem_source.index("controller_mgr_node_.reset();")
            ):
                raise SystemExit("Internal controller-manager teardown order validation failed.")
            tem_path.write_text(tem_source)

          print("A/B mode: TrajectoryExecutionManager source is left unmodified; only move_group signal-wait/deferred Context shutdown is patched.")
          print("Applied structured MoveIt Jazzy signal-wait patch.")
          print("Validated unique include/init/executor/spin/main anchors and deferred context shutdown.")
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.hpp

      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git clone --depth 1 --branch fix/mock-planning-shutdown-and-controller-gates https://github.com/rexyll/staubli_driver_ros2_from_org.git /tmp/staubli_ws/src/staubli_driver_ros2
          python3 - <<'PY'
          from pathlib import Path
          
          path = Path("/tmp/staubli_ws/src/staubli_driver_ros2/staubli_moveit_config/test/test_moveit_mock_planning.launch.py")
          source = path.read_text()
          
          import_anchor = "from controller_manager_msgs.srv import ListControllers\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("Expected one ListControllers import; refusing to patch.")
          source = source.replace(
              import_anchor,
              import_anchor + "from controller_manager_msgs.srv import SwitchController\n",
              1,
          )
          
          test_anchor = """        self.assertEqual(
                      set(result.planned_trajectory.joint_trajectory.joint_names),
                      {f"joint_{index}" for index in range(1, 7)},
                  )
          """
          test_replacement = test_anchor + """
                  # Deactivate through controller_manager's switch service while its
                  # control loop is alive. This avoids racing its pre-shutdown callback
                  # against JointTrajectoryController::update() during process teardown.
                  switch_client = self.node.create_client(
                      SwitchController, "/controller_manager/switch_controller"
                  )
                  self.assertTrue(
                      switch_client.wait_for_service(timeout_sec=15.0),
                      "controller_manager switch_controller service did not become available",
                  )
                  switch_request = SwitchController.Request()
                  switch_request.deactivate_controllers = ["joint_trajectory_controller"]
                  switch_request.strictness = SwitchController.Request.STRICT
                  switch_future = switch_client.call_async(switch_request)
                  rclpy.spin_until_future_complete(self.node, switch_future, timeout_sec=20.0)
                  self.assertTrue(switch_future.done(), "controller deactivation timed out")
                  switch_response = switch_future.result()
                  self.assertIsNotNone(switch_response)
                  self.assertTrue(switch_response.ok, "joint_trajectory_controller deactivation failed")
          
                  deadline = time.monotonic() + 10.0
                  controller_inactive = False
                  while time.monotonic() < deadline:
                      future = controller_client.call_async(ListControllers.Request())
                      rclpy.spin_until_future_complete(self.node, future, timeout_sec=3.0)
                      if future.done() and future.result() is not None:
                          states = {item.name: item.state for item in future.result().controller}
                          controller_inactive = states.get("joint_trajectory_controller") == "inactive"
                          if controller_inactive:
                              break
                      time.sleep(0.1)
                  self.assertTrue(
                      controller_inactive,
                      "joint_trajectory_controller did not reach inactive state before shutdown",
                  )
          """
          if source.count(test_anchor) != 1:
              raise SystemExit("Expected one completed planning assertion block; refusing to patch.")
          source = source.replace(test_anchor, test_replacement, 1)
          path.write_text(source)
          print("Added orderly controller deactivation after plan-only test and before launch shutdown.")
          PY
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=ON

      - name: Run mock planning and strict teardown regression
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          unset LD_PRELOAD ASAN_OPTIONS
          echo "Running native non-ASan strict mock planning + teardown regression."
          export STAUBLI_MOVE_GROUP_GDB_PREFIX='gdb -q -batch -return-child-result -ex "set pagination off" -ex "disable pretty-printer" -ex "set print pretty off" -ex "set print elements 0" -ex "handle SIGINT nostop noprint pass" -ex "set environment LD_DEBUG files" -ex run -ex "bt" -ex "frame 15" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start" -ex "p/x executor.wait_set_.waitables_._M_impl._M_finish" -ex "p/x executor.wait_set_.waitables_._M_impl._M_end_of_storage" -ex "p (long)(executor.wait_set_.waitables_._M_impl._M_finish - executor.wait_set_.waitables_._M_impl._M_start)" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[0].waitable._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[0].waitable._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[0].associated_entity._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[0].associated_entity._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[1].waitable._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[1].waitable._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[1].associated_entity._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[1].associated_entity._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[2].waitable._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[2].waitable._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[2].associated_entity._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[2].associated_entity._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[3].waitable._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[3].waitable._M_refcount._M_pi" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[3].associated_entity._M_ptr" -ex "p/x executor.wait_set_.waitables_._M_impl._M_start[3].associated_entity._M_refcount._M_pi" -ex "p/x executor.wait_set_.sh
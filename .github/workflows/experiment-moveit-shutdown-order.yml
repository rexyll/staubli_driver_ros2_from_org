                  send_future = client.send_goal_async(goal)
                  rclpy.spin_until_future_complete(self.node, send_future, timeout_sec=30.0)
                  self.assertTrue(send_future.done(), "MoveGroup execution goal submission timed out")
                  goal_handle = send_future.result()
                  self.assertIsNotNone(goal_handle)
                  self.assertTrue(goal_handle.accepted, "MoveGroup rejected the execution goal")

                  result_future = goal_handle.get_result_async()
                  rclpy.spin_until_future_complete(self.node, result_future, timeout_sec=120.0)
                  self.assertTrue(result_future.done(), "MoveGroup execution result timed out")
                  result = result_future.result().result
                  self.assertEqual(result.error_code.val, MoveItErrorCodes.SUCCESS)
                  self.assertTrue(
                      result.planned_trajectory.joint_trajectory.points,
                      "MoveIt did not return the planned trajectory",
                  )
          '''

          source = source.replace(
              shutdown_anchor,
              "\n\n" + cross_pipeline_method + "\n" + concurrency_method + "\n" + method + shutdown_anchor,
              1,
          )
          test_path.write_text(source)
          print("Added active OMPL -> live Pilz cross-pipeline probe, same-pipeline overlap coverage, and mock execution coverage.")
          PY
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=ON

      - name: Run uninstrumented A-PSM-retained + K + B-core mock teardown regression (10 repetitions)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          unset LD_PRELOAD ASAN_OPTIONS
          export STAUBLI_ACTIVE_PROBE=1
          export STAUBLI_TERMINATE_PROBE=1
          export STAUBLI_CROSS_PIPELINE_PROBE=1
          export STAUBLI_FORCE_DEFAULT_PILZ=1
          # Capture DSO unload events, then inspect each CallbackGroup weak ServiceBase
          # control block at the reproducible pnode_ teardown SIGSEGV.
          # This is diagnostic-only; it does not change MoveIt/rclcpp/driver source.
          cat > /tmp/staubli-move-group.gdb <<'GDB'
          set pagination off
          set confirm off
          set debuginfod enabled off
          set print pretty on
          set breakpoint pending on
          handle SIGINT nostop noprint pass
          handle SIGSEGV stop print nopass

          # Record the exact DSO path before GDB removes its objfile on dlclose.
          python
          import gdb
          import re
          sequence_capability_ranges = []

          def _staubli_capture_sequence_sections():
              try:
                  output = gdb.execute("maintenance info sections ALLOBJ", to_string=True)
                  active_sequence_objfile = False
                  path_suffix = "libsequence_capability.so"
                  section_re = re.compile(
                      r"(?:\[\s*\d+\]\s*)?0x([0-9a-fA-F]+)\s*->\s*0x([0-9a-fA-F]+)"
                      r"\s+at\s+0x[0-9a-fA-F]+\s*:\s*(\.\S+)"
                  )
                  for line in output.splitlines():
                      obj_match = re.match(r"\s*Object file:\s*(.*)", line)
                      if obj_match:
                          object_path = obj_match.group(1).strip().strip('"')
                          active_sequence_objfile = object_path.endswith(path_suffix)
                          if active_sequence_objfile:
                              gdb.write("[GDB-DL-OBJECT] %s\n" % object_path)
                          continue
                      if active_sequence_objfile and "->" in line and " at " in line:
                          # Preserve raw section records so a GDB format change cannot silently look like a negative match.
                          gdb.write("[GDB-DL-RAW] %s\n" % line.strip())
                          match = section_re.search(line)
                          if match:
                              start = int(match.group(1), 16)
                              end = int(match.group(2), 16)
                              name = match.group(3)
                              if start < end:
                                  sequence_capability_ranges.append((start, end, name))
                                  gdb.write(
                                      "[GDB-DL-SECTION] section=%s start=0x%x end=0x%x\n"
                                      % (name, start, end)
                                  )
                  if not sequence_capability_ranges:
                      gdb.write("[GDB-DL-SECTION-ERROR] no sequence capability sections parsed\n")
                  else:
                      gdb.write("[GDB-DL-SECTION-COUNT] parsed=%d\n" % len(sequence_capability_ranges))
              except Exception as exc:
                  gdb.write("[GDB-DL-SECTION-ERROR] %s\n" % exc)

          def _staubli_on_new_objfile(event):
              try:
                  obj = event.new_objfile
                  filename = obj.filename or ""
                  if filename.endswith("libsequence_capability.so"):
                      gdb.write("[GDB-DL-OPEN] %s\n" % filename)
                      _staubli_capture_sequence_sections()
              except Exception as exc:
                  gdb.write("[GDB-DL-OPEN-ERROR] %s\n" % exc)

          def _staubli_on_free_objfile(event):
              try:
                  filename = event.objfile.filename or ""
                  if filename.endswith("libsequence_capability.so"):
                      gdb.write("[GDB-DL-CLOSE] %s\n" % filename)
              except Exception as exc:
                  gdb.write("[GDB-DL-CLOSE-ERROR] %s\n" % exc)

          try:
              gdb.events.new_objfile.connect(_staubli_on_new_objfile)
              gdb.events.free_objfile.connect(_staubli_on_free_objfile)
          except Exception as exc:
              gdb.write("[GDB-DL-HOOK-ERROR] %s\n" % exc)
          end

          # Correlate service creation with its owning NodeBase and actual CallbackGroup.
          break /tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp/node_interfaces/node_services.cpp:29
          commands
            silent
            set $service_control = service_base_ptr._M_refcount._M_pi
            set $service_vptr = *(void **)$service_control
            printf "[GDB-SERVICE-OWNER] node_base=%p service=%p name=%s control=%p vptr=%p\n", node_base_, service_base_ptr._M_ptr, service_base_ptr._M_ptr->get_service_name(), $service_control, $service_vptr
            info symbol $service_vptr
            continue
          end
          break /tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp/callback_group.cpp:179
          commands
            silent
            set $group_service_control = service_ptr._M_refcount._M_pi
            set $group_service_vptr = *(void **)$group_service_control
            printf "[GDB-CBG-SERVICE-ADD] group=%p service=%p name=%s control=%p vptr=%p\n", this, service_ptr._M_ptr, service_ptr._M_ptr->get_service_name(), $group_service_control, $group_service_vptr
            info symbol $group_service_vptr
            continue
          end

          run
          # A clean inferior exit is a valid success path. Do not run post-mortem
          # commands such as "bt full" after normal exit (there is no stack).
          if !$_isvoid ($_exitcode)
            printf "[GDB-INFERIOR-EXIT] code=%d\n", $_exitcode
            if $_exitcode != 0
              quit 1
            end
            quit 0
          end
          # SIGSEGV is configured as stop/print/nopass, so a crashing inferior
          # remains stopped here and proceeds to the fault-frame diagnostics below.
          info program
          bt full
          info sharedlibrary
          info proc mappings
          info registers

          # Preserve registers from the crashing frame. Do not dereference $rax:
          # it is the invalid vptr target and the previous script stopped here.
          frame 0
          set $fault_pc = $pc
          set $fault_rax = $rax
          set $fault_cb = $rdi
          printf "[GDB-FAULT] pc=%p rax=%p control_block=%p\n", $fault_pc, $fault_rax, $fault_cb
          set $fault_vptr = *(void **)$fault_cb
          printf "[GDB-FAULT-CONTROL] control_block=%p vptr=%p\n", $fault_cb, $fault_vptr
          info symbol $fault_vptr
          python
          import gdb
          fault_vptr = int(gdb.parse_and_eval("$fault_vptr"))
          matches = [
              (name, start, end)
              for start, end, name in sequence_capability_ranges
              if start <= fault_vptr < end
          ]
          if matches:
              for name, start, end in matches:
                  gdb.write(
                      "[GDB-VPTR-DSO-MATCH] vptr=0x%x section=%s range=[0x%x,0x%x)\\n"
                      % (fault_vptr, name, start, end)
                  )
          else:
              gdb.write(
                  "[GDB-VPTR-DSO-NO-MATCH] vptr=0x%x sequence_capability_sections=%d\\n"
                  % (fault_vptr, len(sequence_capability_ranges))
              )
          end
          x/4gx $fault_cb

          # Identify the exact CallbackGroup whose weak ServiceBase entry is dying.
          frame 10
          info args
          set $crash_group = this
          set $service_count = this->service_ptrs_.size()
          printf "[GDB-GROUP] callback_group=%p service_count=%ld\n", $crash_group, (long)$service_count
          set $i = 0
          while $i < $service_count
            set $weak_object = this->service_ptrs_[$i]._M_ptr
            set $cb = this->service_ptrs_[$i]._M_refcount._M_pi
            printf "[GDB-WEAK] index=%d object=%p control=%p\n", $i, $weak_object, $cb
            if $cb != 0
              set $entry_vptr = *(void **)$cb
              printf "[GDB-WEAK-CONTROL] index=%d vptr=%p\n", $i, $entry_vptr
              info symbol $entry_vptr
            else
              printf "[GDB-WEAK-CONTROL] index=%d null-control-block\n", $i
            end
            set $i = $i + 1
          end

          # Map the dying Node to PSM node_, pnode_, or the TF listener's private Node.
          frame 24
          set $destroying_node = this
          set $destroying_node_base = this->node_base_._M_ptr
          printf "[GDB-NODE-DTOR] node=%p node_base=%p\n", $destroying_node, $destroying_node_base
          frame 30
          set $psm_node = this->node_._M_ptr
          set $psm_pnode = this->pnode_._M_ptr
          set $psm_tf_listener = this->tf_listener_._M_ptr
          printf "[GDB-PSM-NODES] node=%p pnode=%p tf_listener=%p\n", $psm_node, $psm_pnode, $psm_tf_listener
          python
          try:
              tf_node = gdb.parse_and_eval("this->tf_listener_._M_ptr->optional_default_node_._M_ptr")
              gdb.write("[GDB-TF-DEFAULT-NODE] %s\n" % tf_node)
          except Exception as exc:
              gdb.write("[GDB-TF-DEFAULT-NODE-UNAVAILABLE] %s\n" % exc)
          end
          printf "[GDB-NODE-MATCH] dying=%p is_psm_node=%d is_pnode=%d\n", $destroying_node, $destroying_node == $psm_node, $destroying_node == $psm_pnode

          frame 0
          x/8i $pc
          GDB
          export STAUBLI_MOVE_GROUP_GDB_PREFIX='gdb --quiet --batch -x /tmp/staubli-move-group.gdb --args'
          cd /tmp/staubli_ws
          pilz_prefix="$(ros2 pkg prefix pilz_industrial_motion_planner)"
          case "$pilz_prefix" in
            /tmp/moveit_ws/install/pilz_industrial_motion_planner) ;;
            *) echo "Expected source-overlay Pilz package, got: $pilz_prefix"; exit 1 ;;
          esac
          test -f "$pilz_prefix/lib/libsequence_capability.so"
          echo "Verified Sequence capability is loaded from source overlay: $pilz_prefix/lib/libsequence_capability.so"
          package_prefix="$(ros2 pkg prefix staubli_moveit_config)"
          test -d "$package_prefix"
          colcon list --base-paths src | awk '{print $1}' | grep -Fx "staubli_moveit_config"
          git -C /tmp/rclcpp_ws/src/rclcpp diff --exit-code
          if grep -R -E 'WaitSet WeakWaitableEntry dtor BEGIN|CallbackGroup dtor BEGIN|NodeBase dtor BEGIN|Executor dtor body BEGIN' /tmp/rclcpp_ws/src/rclcpp/rclcpp; then
            echo "Unexpected CI lifecycle instrumentation remains in rclcpp source."
            exit 1
          fi
          echo "Test workspace preflight passed: package=staubli_moveit_config prefix=$package_prefix; rclcpp source pristine."
          echo "Running A-PSM-retained treatment with stock rclcpp runtime semantics; move_group wrapped in batch GDB."
          failures=0
          for iteration in $(seq 1 10); do
            echo "=== A-PSM-retained + K + B-core clean repetition $iteration/10 ==="
            output_log="/tmp/staubli_ws/a-psm-retained-k-b-core-clean-$iteration.log"
            set +e
            colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure 2>&1 | tee "$output_log"
            test_rc=$?
            set -e
            result_log="${output_log}.result.log"
            set +e
            colcon test-result --verbose 2>&1 | tee "$result_log"
            result_rc=$?
            set -e
            set +e
            python3 - "$output_log" "$result_log" <<'PY'
          import re
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          result_lines = Path(sys.argv[2]).read_text(errors="replace").splitlines()
          sigsegv = [line for line in lines if "received signal SIGSEGV" in line]
          if sigsegv:
              raise SystemExit(f"move_group received SIGSEGV under GDB: {sigsegv[0]}")
          normal_exits = [line for line in lines if "[GDB-INFERIOR-EXIT] code=0" in line]
          if len(normal_exits) != 1:
              raise SystemExit(f"Expected exactly one clean GDB inferior exit marker, observed {len(normal_exits)}")
          markers = [
              "shutdown core-B: private executor reset BEGIN",
              "shutdown core-B: private executor node removed",
              "shutdown core-B: private executor reset END",
              "shutdown core-B: controller manager reset BEGIN",
              "shutdown core-B: controller manager reset END",
              "shutdown core-B: controller node reset BEGIN use_count=1",
              "shutdown core-B: controller node reset END",
              "shutdown core-B: controller-manager loader reset BEGIN",
              "shutdown core-B: controller-manager loader reset END",
          ]
          positions = []
          for marker in markers:
              found = next((i for i, line in enumerate(lines) if marker in line), None)
              if found is None:
                  raise SystemExit(f"Missing lifecycle marker: {marker}")
              positions.append(found)
          if positions != sorted(positions):
              raise SystemExit(f"B-core teardown markers out of order: {positions}")

          action_successes = sum(
              "Completed trajectory execution with status SUCCEEDED" in line
              for line in lines
          )
          if action_successes != 1:
              raise SystemExit(f"Expected exactly one successful mock execution, observed {action_successes}")
          launch_tests = sum("Ran 1 test in" in line for line in lines)
          if launch_tests != 1:
              raise SystemExit(f"Expected one launch test execution, observed {launch_tests}")
          concurrent_suites = sum("Ran 4 tests in" in line for line in lines)
          if concurrent_suites != 1:
              raise SystemExit(f"Expected the four-test pre-shutdown launch suite, observed {concurrent_suites}")
          # colcon test-result writes the aggregate summary to result_log, not output_log.
          # The new same-pipeline unittest adds one xUnit test case to the
          # existing seven-test package summary. Fail closed if the count drifts.
          passing_summaries = sum(
              "Summary: 9 tests, 0 errors, 0 failures, 0 skipped" in line
              for line in result_lines
          )
          if passing_summaries != 1:
              raise SystemExit(f"Expected one clean 9-test summary, observed {passing_summaries}")
          cancel_requested = [line for line in lines if "[STAUBLI_REQUEST_TOKEN] CANCEL_REQUESTED " in line]
          cancel_observed = [line for line in lines if "[STAUBLI_REQUEST_TOKEN] CANCEL_OBSERVED " in line]
          if len(cancel_requested) < 2 or len(cancel_observed) < 2:
              raise SystemExit(
                  f"Expected >=2 request-token cancel request/observation markers in this repetition; "
                  f"requested={len(cancel_requested)} observed={len(cancel_observed)}"
              )
          probe_names = ("SLOW_ENTER", "FAST_ENTER", "BARRIER_OPEN", "FAST_EXIT", "SLOW_RESUME")
          probe_markers = {}
          for name in probe_names:
              found = [line for line in lines if f"[STAUBLI_ACTIVE_PROBE] {name} " in line]
              if len(found) != 1:
                  raise SystemExit(f"Expected exactly one active-probe {name} marker, observed {len(found)}")
              probe_markers[name] = found[0]
          pipeline_addresses = {
              match.group(1) if (match := re.search(r"pipeline=(0x[0-9a-fA-F]+)", line)) else None
              for line in probe_markers.values()
          }
          if len(pipeline_addresses) != 1 or None in pipeline_addresses:
              raise SystemExit(f"Probe roles did not use one identical PlanningPipeline object: {pipeline_addresses}")
          marker_order = ("SLOW_ENTER", "FAST_ENTER", "BARRIER_OPEN", "FAST_EXIT", "SLOW_RESUME")
          marker_positions = [lines.index(probe_markers[name]) for name in marker_order]
          if marker_positions != sorted(marker_positions):
              raise SystemExit(f"Active-probe markers are out of order: {marker_positions}")
          fast_exit = re.search(
              r"FAST_EXIT pipeline=(0x[0-9a-fA-F]+) active=(\d+) probe_inflight=(\d+) slow_inflight=(\d+)",
              probe_markers["FAST_EXIT"],
          )
          if not fast_exit or fast_exit.group(2) != "1" or fast_exit.group(3) != "1" or fast_exit.group(4) != "1":
              raise SystemExit(f"Fast completion did not preserve active=1 while one slow call remained: {probe_markers['FAST_EXIT']}")
          slow_resume = re.search(
              r"SLOW_RESUME pipeline=(0x[0-9a-fA-F]+) active=(\d+) probe_inflight=(\d+)",
              probe_markers["SLOW_RESUME"],
          )
          if not slow_resume or slow_resume.group(2) != "1" or slow_resume.group(3) != "1":
              raise SystemExit(f"Slow request did not resume with active=1/probe_inflight=1: {probe_markers['SLOW_RESUME']}")
          # Runtime pipeline map is the authority for this process; do not infer IDs from config files alone.
          pipeline_map_lines = [line for line in lines if "[STAUBLI_PIPELINE_MAP] " in line]
          pipeline_ids = {
              match.group(1)
              for line in pipeline_map_lines
              if (match := re.search(r"\[STAUBLI_PIPELINE_MAP\] id=([^ ]+) pipeline=(0x[0-9a-fA-F]+)", line))
          }
          pipeline_ptrs = {
              match.group(2)
              for line in pipeline_map_lines
              if (match := re.search(r"\[STAUBLI_PIPELINE_MAP\] id=([^ ]+) pipeline=(0x[0-9a-fA-F]+)", line))
          }
          if "ompl" not in pipeline_ids or "pilz_industrial_motion_planner" not in pipeline_ids or len(pipeline_ptrs) < 2:
              raise SystemExit(f"MoveItCpp did not expose distinct OMPL and Pilz runtime pipelines: ids={pipeline_ids}, pointers={pipeline_ptrs}")
          route_defaults = [line for line in lines if "[STAUBLI_SEQUENCE_ROUTE] DEFAULT " in line]
          route_calls = [line for line in lines if "[STAUBLI_SEQUENCE_ROUTE] request=" in line]
          if len(route_defaults) != 1 or len(route_calls) != 1:
              raise SystemExit(
                  f"Expected one forced Pilz default and one SequenceService route marker: "
                  f"default={route_defaults}, route={route_calls}"
              )
          default_match = re.search(r"pipeline=(0x[0-9a-fA-F]+)", route_defaults[0])
          route_match = re.search(
              r"request=([^ ]+) selected=(0x[0-9a-fA-F]+) default=(0x[0-9a-fA-F]+) received=(0x[0-9a-fA-F]+)",
              route_calls[0],
          )
          if not default_match or not route_match:
              raise SystemExit(f"Could not parse SequenceService route pointer evidence: {route_defaults}/{route_calls}")
          if not (
              route_match.group(1) == "ompl"
              and route_match.group(2) == route_match.group(4)
              and route_match.group(3) == default_match.group(1)
              and route_match.group(2) != route_match.group(3)
          ):
              raise SystemExit(
                  "SequenceService pipeline dispatch mismatch: expected request=ompl, selected=received=OMPL, "
                  f"default=Pilz and distinct; default={route_defaults[0]} route={route_calls[0]}"
              )
          client_pass = [line for line in lines if "[STAUBLI_ACTIVE_PROBE_CLIENT] PASS plan=SUCCESS sequence=FAILURE terminate=wrapper_called" in line]
          if len(client_pass) != 1:
              raise SystemExit(f"Expected one successful concurrent service-client + terminate-wrapper assertion, observed {len(client_pass)}")
          idle_markers = [line for line in lines if "[STAUBLI_PIPELINE_IDLE] " in line]
          if len(idle_markers) != 2 or any(
              "ompl_active=0" not in line or "pilz_active=0" not in line for line in idle_markers
          ):
              raise SystemExit(f"Expected both pipeline registries to be idle after both request scenarios: {idle_markers}")
          slow_held = [line for line in lines if "[STAUBLI_TERMINATE_PROBE] SLOW_HELD " in line]
          if len(slow_held) != 1 or not re.search(r"active=1", slow_held[0]):
              raise SystemExit(f"Slow call was not held while its pipeline-owned request remained active: {slow_held}")
          wrapper_calls = [line for line in lines if "[STAUBLI_TERMINATE_PROBE] WRAPPER_RETURN " in line]
          if len(wrapper_calls) != 1 or not re.search(r"active_before=1 result=1", wrapper_calls[0]):
              raise SystemExit(f"Expected MoveItCpp wrapper to observe the remaining active request: {wrapper_calls}")
          terminate_entries = [line for line in lines if "[STAUBLI_TERMINATE_PROBE] PIPELINE_TERMINATE_ENTER " in line]
          cross_held = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] A_OMPL_HELD " in line]
          cross_context = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] B_CONTEXT_CREATED " in line]
          cross_wrapper = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] A_WRAPPER_RETURN " in line]
          cross_target = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] B_TARGET_SOLVE " in line]
          cross_control = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] B_CONTROL_SOLVE " in line]
          inflight_entered = [line for line in lines if "[STAUBLI_PILZ_INFLIGHT] SOLVE_ENTERED " in line]
          inflight_terminated = [line for line in lines if "[STAUBLI_PILZ_INFLIGHT] TERMINATE_OBSERVED " in line]
          inflight_released = [line for line in lines if "[STAUBLI_PILZ_INFLIGHT] SOLVE_RELEASED " in line]
          cross_client = [line for line in lines if "[STAUBLI_CROSS_PIPELINE_CLIENT] PASS " in line]
          cross_release = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] RELEASE signal=1" in line]
          pilz_terminate_calls = [line for line in lines if "[STAUBLI_PILZ_TERMINATE] " in line]
          if not all(len(items) == 1 for items in (
              cross_held, cross_context, cross_wrapper, cross_target, cross_control,
              inflight_entered, inflight_terminated, inflight_released,
              cross_client, cross_release
          )) or pilz_terminate_calls:
              raise SystemExit(
                  "Cross-pipeline markers missing/duplicated: "
                  f"held={len(cross_held)} context={len(cross_context)} wrapper={len(cross_wrapper)} "
                  f"inflight_entered={len(inflight_entered)} inflight_terminated={len(inflight_terminated)} "
                  f"inflight_released={len(inflight_released)} target={len(cross_target)} "
                  f"control={len(cross_control)} client={len(cross_client)} release={len(cross_release)} "
                  f"unexpected_pilz_terminate={len(pilz_terminate_calls)}"
              )
          if not re.search(r"active=1", cross_held[0]) or not re.search(r"active_before=1 result=1", cross_wrapper[0]):
              raise SystemExit(f"OMPL was not active at terminate: held={cross_held}, wrapper={cross_wrapper}")
          target_ptr = re.search(r"context=(0x[0-9a-fA-F]+)", cross_context[0])
          if not target_ptr:
              raise SystemExit("Could not parse target Pilz context pointer.")
          terminated_ptr = re.search(r"context=(0x[0-9a-fA-F]+)", inflight_terminated[0])
          released_ptr = re.search(r"context=(0x[0-9a-fA-F]+)", inflight_released[0])
          entered_ptr = re.search(r"context=(0x[0-9a-fA-F]+)", inflight_entered[0])
          if not all((terminated_ptr, released_ptr, entered_ptr)) or any(
              item.group(1) != target_ptr.group(1) for item in (terminated_ptr, released_ptr, entered_ptr)
          ):
              raise SystemExit("Pilz target context pointer mismatch across create/enter/terminate-observe/release markers.")
          if not (
              "terminated=0" in inflight_terminated[0]
              and "solve_done=0" in inflight_terminated[0]
              and "success=1" in inflight_released[0]
              and "code=1" in inflight_released[0]
              and "success=1" in cross_target[0]
              and "code=1" in cross_target[0]
              and "success=1" in cross_control[0]
          ):
              raise SystemExit(
                  "Pilz in-flight/after-terminate/negative-control state mismatch: "
                  f"inflight={inflight_terminated}/{inflight_released}, target={cross_target}, control={cross_control}"
              )
          if len(terminate_entries) != 2:
              raise SystemExit(
                  "Expected exactly two actual PlanningPipeline::terminate entries "
                  "(one cross-pipeline isolation call and one same-pipeline overlap call), "
                  f"got {terminate_entries}"
              )
          # The regression deliberately invokes terminate once in each independent scenario.
          # Prove that each real entry belongs to its intended barrier interval, rather than
          # merely accepting an aggregate count.
          # Keep each event's physical line position. Using lines.index(line) here is
          # incorrect because both terminate calls intentionally print the same text
          # (same PlanningPipeline address), so index() resolves both to the first event.
          cross_held_index = next(i for i, line in enumerate(lines) if "[STAUBLI_CROSS_PIPELINE] A_OMPL_HELD " in line)
          cross_wrapper_index = next(i for i, line in enumerate(lines) if "[STAUBLI_CROSS_PIPELINE] A_WRAPPER_RETURN " in line)
          slow_held_index = next(i for i, line in enumerate(lines) if "[STAUBLI_TERMINATE_PROBE] SLOW_HELD " in line)
          wrapper_return_index = next(i for i, line in enumerate(lines) if "[STAUBLI_TERMINATE_PROBE] WRAPPER_RETURN " in line)
          terminate_events = [
              (i, line) for i, line in enumerate(lines)
              if "[STAUBLI_TERMINATE_PROBE] PIPELINE_TERMINATE_ENTER " in line
          ]
          cross_terminate_events = [
              event for event in terminate_events
              if cross_held_index < event[0] < cross_wrapper_index
          ]
          same_pipeline_terminate_events = [
              event for event in terminate_events
              if slow_held_index < event[0] < wrapper_return_index
          ]
          cross_terminate_entries = [line for _, line in cross_terminate_events]
          same_pipeline_terminate_entries = [line for _, line in same_pipeline_terminate_events]
          if len(cross_terminate_events) != 1 or len(same_pipeline_terminate_events) != 1:
              raise SystemExit(
                  "Actual terminate calls were not uniquely associated with both request scenarios: "
                  f"cross={cross_terminate_entries}, same_pipeline={same_pipeline_terminate_entries}"
              )
          cross_pipeline_ptr = re.search(r"pipeline=(0x[0-9a-fA-F]+)", cross_held[0])
          mapped_ompl = [
              line for line in lines
              if "[STAUBLI_PIPELINE_MAP] id=ompl " in line
          ]
          terminate_ptrs = [
              re.search(r"this=(0x[0-9a-fA-F]+)", line)
              for line in terminate_entries
          ]
          mapped_ompl_ptr = re.search(r"pipeline=(0x[0-9a-fA-F]+)", mapped_ompl[0]) if len(mapped_ompl) == 1 else None
          if (
              not cross_pipeline_ptr or not mapped_ompl_ptr
              or any(ptr is None or ptr.group(1) != cross_pipeline_ptr.group(1) for ptr in terminate_ptrs)
              or mapped_ompl_ptr.group(1) != cross_pipeline_ptr.group(1)
          ):
              raise SystemExit(
                  "Both terminate entries must target the exact OMPL pipeline used by the "
                  f"cross-pipeline and same-pipeline probes: held={cross_held}, map={mapped_ompl}, "
                  f"terminate={terminate_entries}"
              )
          cross_released = [line for line in lines if "[STAUBLI_CROSS_PIPELINE] A_OMPL_RELEASED released=1" in line]
          if len(cross_released) != 1:
              raise SystemExit(f"OMPL cross-pipeline barrier did not release cleanly: {cross_released}")
          # The solve-barrier callback logs SOLVE_ENTERED before its caller emits
          # B_CONTEXT_CREATED; assert the observed callback/caller order exactly.
          cross_order = [
              lines.index(cross_held[0]), lines.index(inflight_entered[0]), lines.index(cross_context[0]),
              cross_terminate_events[0][0], lines.index(cross_wrapper[0]),
              lines.index(inflight_terminated[0]), lines.index(inflight_released[0]),
              lines.index(cross_target[0]), lines.index(cross_control[0]), lines.index(cross_release[0]),
              lines.index(cross_released[0])
          ]
          if cross_order != sorted(cross_order):
              raise SystemExit(f"Cross-pipeline event ordering invalid: {cross_order}")
          slow_releases = [line for line in lines if "[STAUBLI_TERMINATE_PROBE] SLOW_RELEASED released=1" in line]
          service_releases = [line for line in lines if "[STAUBLI_TERMINATE_PROBE] RELEASE slow=1" in line]
          if len(slow_releases) != 1 or len(service_releases) != 1:
              raise SystemExit(f"Slow hold/release did not complete cleanly: slow={slow_releases}, service={service_releases}")
          if not (
              slow_held_index < same_pipeline_terminate_events[0][0]
              < wrapper_return_index < lines.index(service_releases[0])
              < lines.index(slow_releases[0])
          ):
              raise SystemExit("Expected slow hold -> MoveItCpp wrapper -> release signal -> slow resume ordering.")
          psm_retained = [
              line for line in lines
              if "[OWNER] PSM retained after MoveGroupExe/executor scope" in line
          ]
          if len(psm_retained) != 1:
              raise SystemExit(f"Expected exactly one PSM-retained weak-owner marker, observed {len(psm_retained)}")
          if not any("use_count=" in line for line in psm_retained):
              raise SystemExit("PSM-retained marker did not report weak_ptr use_count.")
          psm_reset_begin = [line for line in lines if "[OWNER] PSM explicit reset BEGIN" in line]
          psm_reset_end = [line for line in lines if "[OWNER] PSM explicit reset END" in line]
          psm_dtor_begin = [line for line in lines if "[PSM-DTOR] BEGIN" in line]
          psm_dtor_body_end = [line for line in lines if "[PSM-DTOR] BODY-END" in line]
          if not (len(psm_reset_begin) == len(psm_reset_end) == len(psm_dtor_begin) == 1):
              raise SystemExit(
                  "Expected one explicit PSM reset BEGIN/END and one PSM destructor BEGIN marker."
              )
          if len(psm_dtor_body_end) > 1:
              raise SystemExit("Observed duplicate PSM destructor BODY-END markers.")

          if any(
              "Segmentation fault" in line or "exit code -11" in line
              for line in lines
          ):
              raise SystemExit("Detected a segmentation fault or SIGSEGV exit.")
          if any(
              "test_all_processes_exit_cleanly" in lines[i] and "FAIL" in lines[i]
              for i in range(len(lines))
          ):
              raise SystemExit("Post-shutdown process-exit assertion failed.")
          print(
              "Uninstrumented A-PSM-retained / B-core order verified; one mock execution succeeded; "
              "one launch test and all eight package xUnit assertions passed."
          )
          PY
            order_rc=$?
            set -e
            echo "=== A-PSM-retained repetition $iteration/10 exit summary: colcon_test=$test_rc, test_result=$result_rc, lifecycle_order=$order_rc ==="
            if [ "$test_rc" -ne 0 ] || [ "$result_rc" -ne 0 ] || [ "$order_rc" -ne 0 ]; then
              failures=$((failures + 1))
              echo "Clean repetition $iteration/10 failed acceptance."
            fi
          done
          echo "=== A-PSM-retained + K + B-core uninstrumented complete: failures=$failures/10 ==="
          test "$failures" -eq 0

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/rclcpp_ws/log
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
            /tmp/staubli_ws/k-only-pruning-*.log
            /tmp/staubli_ws/a-k-b-core-*.log
            /tmp/staubli_ws/a-psm-retained-k-b-core-clean-*.log
            /tmp/staubli_ws/a-psm-retained-k-b-core-clean-*.result.log
          if-no-files-found: ignore

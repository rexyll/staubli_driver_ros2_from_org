name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch and build instrumented ROS 2 Jazzy rclcpp overlay
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label} anchor; found {source.count(old)}")
              path.write_text(source.replace(old, new, 1))

          base = Path("/tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp")
          callback = base / "callback_group.cpp"
          source = callback.read_text()
          source = source.replace("#include <algorithm>\n", "#include <algorithm>\n#include <cstdio>\n", 1)
          replace_once(callback, "CallbackGroup::~CallbackGroup()\n{\n  trigger_notify_guard_condition();\n}\n", "CallbackGroup::~CallbackGroup()\n{\n  std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] CallbackGroup dtor this=%p notify_gc=%p context_expired=%d\\n\", this, notify_guard_condition_.get(), context_.expired());\n  trigger_notify_guard_condition();\n  std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] CallbackGroup dtor complete this=%p\\n\", this);\n}\n", "CallbackGroup destructor")
          replace_once(callback, "  if (notify_guard_condition_) {\n    notify_guard_condition_->trigger();\n  }\n", "  if (notify_guard_condition_) {\n    std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] CallbackGroup trigger begin this=%p gc=%p\\n\", this, notify_guard_condition_.get());\n    notify_guard_condition_->trigger();\n    std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] CallbackGroup trigger end this=%p\\n\", this);\n  } else {\n    std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] CallbackGroup has no notify guard condition this=%p\\n\", this);\n  }\n", "CallbackGroup guard trigger")

          guard = base / "guard_condition.cpp"
          source = guard.read_text()
          source = source.replace("#include <functional>\n", "#include <functional>\n#include <cstdio>\n", 1)
          replace_once(guard, "void\nGuardCondition::trigger()\n{\n  rcl_ret_t ret = rcl_trigger_guard_condition(&rcl_guard_condition_);\n", "void\nGuardCondition::trigger()\n{\n  std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] GuardCondition trigger begin this=%p rcl_gc=%p\\n\", this, &rcl_guard_condition_);\n  rcl_ret_t ret = rcl_trigger_guard_condition(&rcl_guard_condition_);\n  std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] GuardCondition rcl trigger returned this=%p ret=%d\\n\", this, static_cast<int>(ret));\n", "GuardCondition trigger entry")
          replace_once(guard, "    if (on_trigger_callback_) {\n      on_trigger_callback_(1);\n    } else {\n      unread_count_++;\n    }\n", "    if (on_trigger_callback_) {\n      std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] GuardCondition callback begin this=%p\\n\", this);\n      on_trigger_callback_(1);\n      std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] GuardCondition callback end this=%p\\n\", this);\n    } else {\n      unread_count_++;\n      std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] GuardCondition no callback this=%p unread=%zu\\n\", this, unread_count_);\n    }\n", "GuardCondition callback")

          waitable = base / "executors" / "executor_notify_waitable.cpp"
          source = waitable.read_text()
          source = source.replace("#include <iostream>\n", "#include <iostream>\n#include <cstdio>\n", 1)
          replace_once(waitable, "  if (notify_guard_conditions_.count(weak_guard_condition) != 0) {\n    notify_guard_conditions_.erase(weak_guard_condition);\n    auto guard_condition = weak_guard_condition.lock();\n", "  if (notify_guard_conditions_.count(weak_guard_condition) != 0) {\n    auto guard_condition = weak_guard_condition.lock();\n    std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] NotifyWaitable remove gc=%p on_ready=%d\\n\", guard_condition.get(), static_cast<int>(static_cast<bool>(on_ready_callback_)));\n    notify_guard_conditions_.erase(weak_guard_condition);\n", "notify waitable remove")
          replace_once(waitable, "      guard_condition->set_on_trigger_callback(nullptr);\n", "      {\n        std::fprintf(stderr, \"[RCLCPP_SHUTDOWN_PROBE] NotifyWaitable clearing callback gc=%p\\n\", guard_condition.get());\n        guard_condition->set_on_trigger_callback(nullptr);\n      }\n", "notify callback clear")

          print("Instrumented CallbackGroup destructor/trigger, GuardCondition::trigger, and ExecutorNotifyWaitable callback removal.")
          PY
          rosdep install --from-paths /tmp/rclcpp_ws/src/rclcpp/rclcpp --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-select rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply controlled signal-wait and teardown-order experiment
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          def replace_once(pattern, replacement, label):
              global source
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}; refusing to patch.")
              source = updated

          replace_once(
              r"^#include <set>\n",
              "#include <set>\n#include <atomic>\n#include <pthread.h>\n#include <signal.h>\n#include <thread>\n",
              "include insertion",
          )

          replace_once(
              r"^  const auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>\(nh, moveit_cpp_options\);$",
              "  auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);",
              "mutable MoveItCpp handle",
          )
          replace_once(
              r"^  const auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst\(\);$",
              "  auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();",
              "mutable planning scene monitor handle",
          )

          replace_once(
              r"^  rclcpp::init\(argc, argv\);$",
              "  sigset_t shutdown_signals;\n"
              "  sigemptyset(&shutdown_signals);\n"
              "  sigaddset(&shutdown_signals, SIGINT);\n"
              "  sigaddset(&shutdown_signals, SIGTERM);\n"
              "  sigaddset(&shutdown_signals, SIGUSR1);\n"
              "  const int signal_mask_result = pthread_sigmask(SIG_BLOCK, &shutdown_signals, nullptr);\n"
              "  if (signal_mask_result != 0)\n"
              "  {\n"
              "    return signal_mask_result;\n"
              "  }\n\n"
              "  rclcpp::InitOptions init_options;\n"
              "  init_options.shutdown_on_signal = false;\n"
              "  rclcpp::init(argc, argv, init_options, rclcpp::SignalHandlerOptions::None);\n"
              "  {",
              "rclcpp init replacement",
          )

          replace_once(
              r"^(    move_group::MoveGroupExe mge\(moveit_cpp, default_planning_pipeline, debug\);)$",
              lambda match: match.group(1) + "\n"
              "    std::atomic<bool> signal_waiter_done{false};\n"
              "    std::thread signal_waiter([&executor, &shutdown_signals, &signal_waiter_done]() {\n"
              "      int signal_number = 0;\n"
              "      const int wait_result = sigwait(&shutdown_signals, &signal_number);\n"
              "      if (wait_result != 0 || signal_number != SIGUSR1)\n"
              "      {\n"
              "        executor.cancel();\n"
              "      }\n"
              "      signal_waiter_done.store(true);\n"
              "    });",
              "MoveGroupExe insertion",
          )

          replace_once(
              r"^    executor\.spin\(\);\n\s*rclcpp::shutdown\(\);$",
              "    executor.spin();\n"
              "    if (!signal_waiter_done.load())\n"
              "    {\n"
              "      pthread_kill(signal_waiter.native_handle(), SIGUSR1);\n"
              "    }\n"
              "    signal_waiter.join();\n"
              "    executor.remove_node(nh);\n"
              "    size_t remaining_callback_group_count = 0;\n"
              "    {\n"
              "      const auto remaining_callback_groups = executor.get_all_callback_groups();\n"
              "      remaining_callback_group_count = remaining_callback_groups.size();\n"
              "    }\n"
              "    RCLCPP_INFO(nh->get_logger(), \"shutdown probe after executor detach flush: remaining_callback_groups=%zu context_valid=%d\", "
              "      remaining_callback_group_count, nh->get_node_base_interface()->get_context()->is_valid());\n"
              "    RCLCPP_INFO(nh->get_logger(), \"shutdown probe after outer executor detach: context_valid=%d\", "
              "nh->get_node_base_interface()->get_context()->is_valid());",
              "executor shutdown replacement",
          )

          replace_once(
              r"^  return 0;\n}$",
              "  RCLCPP_INFO(nh->get_logger(), \"shutdown probe before PSM reset: context_valid=%d\", "
              "nh->get_node_base_interface()->get_context()->is_valid());\n"
              "  planning_scene_monitor.reset();\n"
              "  RCLCPP_INFO(nh->get_logger(), \"shutdown probe after PSM reset: context_valid=%d\", "
              "nh->get_node_base_interface()->get_context()->is_valid());\n"
              "  moveit_cpp.reset();\n"
              "  RCLCPP_INFO(nh->get_logger(), \"shutdown probe after MoveItCpp reset: context_valid=%d\", "
              "nh->get_node_base_interface()->get_context()->is_valid());\n"
              "  nh.reset();\n"
              "  puts(\"shutdown probe after main Node reset\");\n"
              "  }\n  rclcpp::shutdown();\n  return 0;\n}",
              "main scope close",
          )

          if source.count("rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one deferred rclcpp::shutdown(); refusing to continue.")
          if source.count("rclcpp::SignalHandlerOptions::None") != 1:
              raise SystemExit("Signal handler suppression was not applied exactly once.")
          if source.count("pthread_sigmask(SIG_BLOCK") != 1:
              raise SystemExit("Signal mask validation failed.")
          if "signal_waiter.join();" not in source or "executor.cancel();" not in source:
              raise SystemExit("Signal waiter lifecycle validation failed.")

          path.write_text(source)

          tem_path = Path(
              "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/src/"
              "trajectory_execution_manager.cpp"
          )
          tem_source = tem_path.read_text()
          tem_header_path = Path(
              "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/include/"
              "moveit/trajectory_execution_manager/trajectory_execution_manager.hpp"
          )
          tem_header_source = tem_header_path.read_text()
          callback_member_anchor = "  rclcpp::Subscription<std_msgs::msg::String>::SharedPtr event_topic_subscriber_;\n"
          if tem_header_source.count(callback_member_anchor) != 1:
              raise SystemExit("Expected one TEM event subscription member anchor; refusing to patch.")
          tem_header_source = tem_header_source.replace(
              callback_member_anchor,
              callback_member_anchor + "  rclcpp::CallbackGroup::SharedPtr event_callback_group_;\n",
              1,
          )
          tem_header_path.write_text(tem_header_source)
          group_pattern = (
              r"  auto callback_group = node_->create_callback_group\(rclcpp::CallbackGroupType::MutuallyExclusive\);\n"
              r"  auto options = rclcpp::SubscriptionOptions\(\);\n"
              r"  options.callback_group = callback_group;"
          )
          group_replacement = (
              "  event_callback_group_ = node_->create_callback_group(rclcpp::CallbackGroupType::MutuallyExclusive);\n"
              "  auto options = rclcpp::SubscriptionOptions();\n"
              "  options.callback_group = event_callback_group_;"
          )
          tem_source, group_count = re.subn(group_pattern, group_replacement, tem_source, count=1)
          if group_count != 1:
              raise SystemExit(f"Expected exactly one event callback-group anchor, found {group_count}; refusing to patch.")

          tem_pattern = (
              r"TrajectoryExecutionManager::~TrajectoryExecutionManager\(\)\n"
              r"\{\n"
              r"  stopExecution\(true\);\n"
              r"  if \(private_executor_\)\n"
              r"    private_executor_->cancel\(\);\n"
              r"  if \(private_executor_thread_\.joinable\(\)\)\n"
              r"    private_executor_thread_\.join\(\);\n"
              r"\}\n"
          )
          tem_replacement = (
              "TrajectoryExecutionManager::~TrajectoryExecutionManager()\n"
              "{\n"
              "  stopExecution(true);\n"
              "  if (private_executor_)\n"
              "    private_executor_->cancel();\n"
              "  if (private_executor_thread_.joinable())\n"
              "    private_executor_thread_.join();\n"
              "  RCLCPP_INFO(logger_, \"shutdown probe TEM after stop/join: main_context_valid=%d controller_context_valid=%d\", "
              "node_->get_node_base_interface()->get_context()->is_valid(), "
              "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
              "  event_topic_subscriber_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown probe TEM after event subscription reset: main_context_valid=%d\", "
              "node_->get_node_base_interface()->get_context()->is_valid());\n"
              "  callback_handler_.reset();\n"
              "  event_callback_group_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown probe TEM after callback group reset: main_context_valid=%d\", "
              "node_->get_node_base_interface()->get_context()->is_valid());\n"
              "  if (private_executor_ && controller_mgr_node_)\n"
              "    private_executor_->remove_node(controller_mgr_node_);\n"
              "  private_executor_.reset();\n"
              "  controller_manager_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown probe TEM before controller node reset: controller_context_valid=%d\", "
              "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
              "  controller_mgr_node_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown probe TEM after controller node reset: main_context_valid=%d\", "
              "node_->get_node_base_interface()->get_context()->is_valid());\n"
              "}\n"
          )
          tem_updated, tem_count = re.subn(tem_pattern, tem_replacement, tem_source, count=1)
          if tem_count != 1:
              raise SystemExit(
                  f"Expected exactly one TrajectoryExecutionManager destructor anchor, found {tem_count}; "
                  "refusing to patch."
              )
          tem_source = tem_updated
          cleanup_tokens = (
              "event_topic_subscriber_.reset();",
              "callback_handler_.reset();",
              "event_callback_group_.reset();",
              "private_executor_->remove_node(controller_mgr_node_);",
              "private_executor_.reset();",
              "controller_manager_.reset();",
              "controller_mgr_node_.reset();",
          )
          if any(tem_source.count(token) != 1 for token in cleanup_tokens):
              raise SystemExit("Internal controller-manager cleanup validation failed.")
          if not (
              tem_source.index("private_executor_thread_.join();")
              < tem_source.index("event_topic_subscriber_.reset();")
              < tem_source.index("callback_handler_.reset();")
              < tem_source.index("event_callback_group_.reset();")
              < tem_source.index("private_executor_->remove_node(controller_mgr_node_);")
              < tem_source.index("private_executor_.reset();")
              < tem_source.index("controller_manager_.reset();")
              < tem_source.index("controller_mgr_node_.reset();")
          ):
              raise SystemExit("Internal controller-manager teardown order validation failed.")
          tem_path.write_text(tem_source)

          print("Applied explicit detach to both move_group and controller-manager executors.")
          print("Validated cancel, join, callback handler release, node detach, then executor/plugin/node teardown order.")
          print("Applied structured MoveIt Jazzy signal-wait patch.")
          print("Validated unique include/init/executor/spin/main anchors and deferred context shutdown.")
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.hpp

      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git clone --depth 1 --branch fix/mock-planning-shutdown-and-controller-gates https://github.com/rexyll/staubli_driver_ros2_from_org.git /tmp/staubli_ws/src/staubli_driver_ros2
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Run mock planning and strict teardown regression
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          cd /tmp/staubli_ws
          colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/rclcpp_ws/log
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
          if-no-files-found: ignore

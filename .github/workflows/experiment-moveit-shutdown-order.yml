name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"
      - "experiment/move-group-shutdown-order-barrier-fix"
      - "experiment/move-group-stop-execution-join-fix"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git gdb python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch and build unmodified ROS 2 Jazzy rclcpp overlay (no ASan)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp")
          required = [
              root / "callback_group.cpp",
              root / "guard_condition.cpp",
              root / "executors" / "executor_notify_waitable.cpp",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Expected Jazzy rclcpp sources missing: {missing}")
          # Add CI-only lifecycle markers to the temporary rclcpp overlay.
          executor_path = root / "executor.cpp"
          executor_source = executor_path.read_text()
          if "#include <cstdio>" not in executor_source:
              executor_source = executor_source.replace(
                  "#include <cassert>\n",
                  "#include <cassert>\n#include <cstdio>\n",
                  1,
              )
          executor_begin = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          executor_begin_marked = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body BEGIN\\n\");\n"
              "  std::fflush(stderr);\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          if executor_source.count(executor_begin) != 1:
              raise SystemExit("Expected exactly one Executor destructor entry; refusing to instrument.")
          executor_source = executor_source.replace(executor_begin, executor_begin_marked, 1)
          executor_end = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "}"
          )
          executor_end_marked = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body END; WaitSet member destruction follows\\n\");\n"
              "  std::fflush(stderr);\n"
              "}"
          )
          if executor_source.count(executor_end) != 1:
              raise SystemExit("Expected exactly one Executor destructor exit; refusing to instrument.")
          executor_source = executor_source.replace(executor_end, executor_end_marked, 1)
          executor_path.write_text(executor_source)
          print("Applied CI-only Executor destructor entry/exit markers; upstream repository remains untouched.")
          PY
          rosdep install --from-paths /tmp/rclcpp_ws/src/rclcpp/rclcpp --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-select rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply teardown-order experiment (stock signal handling)
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          # Single-variable native A/B: stop and join only the PSM scene-publishing
          # thread after executor.spin() returns, before Context shutdown and before
          # MultiThreadedExecutor destruction. Keep all other upstream MoveIt code intact.
          if source.count("  rclcpp::init(argc, argv);") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::init anchor.")
          if source.count("    executor.spin();") != 1:
              raise SystemExit("Expected exactly one upstream executor.spin anchor.")
          if source.count("    rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown anchor.")
          if "sigwait(" in source or "SignalHandlerOptions::None" in source:
              raise SystemExit("Unexpected custom signal handling in upstream baseline.")
          shutdown_anchor = "    rclcpp::shutdown();"
          if source.count(shutdown_anchor) != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown call.")
          insertion = """    RCLCPP_INFO(nh->get_logger(), "shutdown A/B: stopping PSM scene publisher before Context shutdown");
              planning_scene_monitor->stopPublishingPlanningScene();
              RCLCPP_INFO(nh->get_logger(), "shutdown A/B: PSM scene publisher stopped and joined");
          """
          source = source.replace(shutdown_anchor, insertion + shutdown_anchor, 1)
          if source.count("planning_scene_monitor->stopPublishingScene();") != 0:
              raise SystemExit("Unexpected alternate PSM shutdown anchor.")
          # Keep the main node and MoveItCpp alive only until MoveGroupExe clears
          # capability instances; then destroy them before its plugin loader unloads
          # capability DSOs. The previous run proved nh survived past loader reset.
          moveit_cpp_anchor = "  const auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);"
          moveit_cpp_replacement = "  auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);"
          psm_anchor = "  const auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();"
          psm_replacement = "  auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();"
          if source.count(moveit_cpp_anchor) != 1 or source.count(psm_anchor) != 1:
              raise SystemExit("Expected unique main MoveItCpp/PSM owner declarations.")
          source = source.replace(moveit_cpp_anchor, moveit_cpp_replacement, 1)
          source = source.replace(psm_anchor, psm_replacement, 1)
          shutdown_reset = """    rclcpp::shutdown();
              planning_scene_monitor.reset();
              moveit_cpp.reset();
              nh.reset();"""
          if source.count(shutdown_anchor) != 1:
              raise SystemExit("Expected unique main Context shutdown anchor for owner reset.")
          source = source.replace(shutdown_anchor, shutdown_reset, 1)
          if not (
              source.index("rclcpp::shutdown();")
              < source.index("planning_scene_monitor.reset();")
              < source.index("moveit_cpp.reset();")
              < source.index("nh.reset();")
          ):
              raise SystemExit("Main node owner reset order validation failed.")
          if source.count("planning_scene_monitor->stopPublishingPlanningScene();") != 1:
              raise SystemExit("PSM publisher stop patch validation failed.")
          print("Applied PSM publisher stop and deferred main node-owner release until MoveGroupExe plugin teardown.")

          # Targeted plugin-lifetime A/B: declare MoveGroupExe before the executor,
          # so reverse destruction destroys the executor WaitSet while capability
          # plugin instances and their plugin DSOs are still alive.
          declaration_order = """    rclcpp::executors::MultiThreadedExecutor executor;

              move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);"""
          reordered_declarations = """    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);

              rclcpp::executors::MultiThreadedExecutor executor;"""
          if source.count(declaration_order) != 1:
              raise SystemExit("Expected exactly one executor/MoveGroupExe declaration pair; refusing to reorder.")
          source = source.replace(declaration_order, reordered_declarations, 1)
          if not source.index("move_group::MoveGroupExe mge") < source.index(
              "rclcpp::executors::MultiThreadedExecutor executor"
          ):
              raise SystemExit("MoveGroupExe must be declared before executor for reverse destruction order.")
          if "#include <cstdio>" not in source:
              source = source.replace("#include <memory>\n", "#include <cstdio>\n#include <memory>\n", 1)
          move_group_dtor = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    capabilities_.clear();\n"
              "    context_.reset();\n"
              "    capability_plugin_loader_.reset();\n"
              "  }"
          )
          move_group_dtor_marked = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe dtor BEGIN; capabilities=%zu loader=%d\\n\", "
              "capabilities_.size(), capability_plugin_loader_ ? 1 : 0);\n"
              "    std::fflush(stderr);\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe before capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capabilities_.clear();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    context_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after context_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capability_plugin_loader_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capability_plugin_loader_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "  }"
          )
          if source.count(move_group_dtor) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe destructor; refusing to instrument.")
          source = source.replace(move_group_dtor, move_group_dtor_marked, 1)
          path.write_text(source)
          print("Applied plugin-lifetime A/B and explicit MoveGroupExe capability/loader destructor markers.")

          if True:  # Retain required TEM explicit cleanup alongside main-node/plugin lifetime ordering
            tem_path = Path(
                "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/src/"
                "trajectory_execution_manager.cpp"
            )
            tem_source = tem_path.read_text()
            tem_header_path = Path(
                "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/include/"
                "moveit/trajectory_execution_manager/trajectory_execution_manager.hpp"
            )
            tem_header_source = tem_header_path.read_text()
            callback_member_anchor = "  rclcpp::Subscription<std_msgs::msg::String>::SharedPtr event_topic_subscriber_;\n"
            if tem_header_source.count(callback_member_anchor) != 1:
                raise SystemExit("Expected one TEM event subscription member anchor; refusing to patch.")
            tem_header_source = tem_header_source.replace(
                callback_member_anchor,
                callback_member_anchor + "  rclcpp::CallbackGroup::SharedPtr event_callback_group_;\n",
                1,
            )
            tem_header_path.write_text(tem_header_source)
            group_pattern = (
                r"  auto callback_group = node_->create_callback_group\(rclcpp::CallbackGroupType::MutuallyExclusive\);\n"
                r"  auto options = rclcpp::SubscriptionOptions\(\);\n"
                r"  options.callback_group = callback_group;"
            )
            group_replacement = (
                "  event_callback_group_ = node_->create_callback_group(rclcpp::CallbackGroupType::MutuallyExclusive);\n"
                "  auto options = rclcpp::SubscriptionOptions();\n"
                "  options.callback_group = event_callback_group_;"
            )
            tem_source, group_count = re.subn(group_pattern, group_replacement, tem_source, count=1)
            if group_count != 1:
                raise SystemExit(f"Expected exactly one event callback-group anchor, found {group_count}; refusing to patch.")
  
            tem_pattern = (
                r"TrajectoryExecutionManager::~TrajectoryExecutionManager\(\)\n"
                r"\{\n"
                r"  stopExecution\(true\);\n"
                r"  if \(private_executor_\)\n"
                r"    private_executor_->cancel\(\);\n"
                r"  if \(private_executor_thread_\.joinable\(\)\)\n"
                r"    private_executor_thread_\.join\(\);\n"
                r"\}\n"
            )
            tem_replacement = (
                "TrajectoryExecutionManager::~TrajectoryExecutionManager()\n"
                "{\n"
                "  stopExecution(true);\n"
                "  if (private_executor_)\n"
                "    private_executor_->cancel();\n"
                "  if (private_executor_thread_.joinable())\n"
                "    private_executor_thread_.join();\n"
                "  { std::lock_guard<std::mutex> thread_lock(execution_thread_mutex_); RCLCPP_INFO(logger_, \"shutdown probe TEM execution_thread_joinable=%d\", execution_thread_ && execution_thread_->joinable()); }\n"
                "  { std::lock_guard<std::mutex> state_lock(execution_state_mutex_); RCLCPP_INFO(logger_, \"shutdown probe TEM active_handles_after_stop=%zu\", active_handles_.size()); }\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after stop/join: main_context_valid=%d controller_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid(), "
                "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
                "  event_topic_subscriber_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after event subscription reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "  callback_handler_.reset();\n"
                "  event_callback_group_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after callback group reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "  if (private_executor_ && controller_mgr_node_)\n"
                "    private_executor_->remove_node(controller_mgr_node_);\n"
                "  private_executor_.reset();\n"
                "  controller_manager_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM before controller node reset: controller_context_valid=%d\", "
                "(controller_mgr_node_ && controller_mgr_node_->get_node_base_interface()->get_context()->is_valid()));\n"
                "  controller_mgr_node_.reset();\n"
                "  RCLCPP_INFO(logger_, \"shutdown probe TEM after controller node reset: main_context_valid=%d\", "
                "node_->get_node_base_interface()->get_context()->is_valid());\n"
                "}\n"
            )
            tem_updated, tem_count = re.subn(tem_pattern, tem_replacement, tem_source, count=1)
            if tem_count != 1:
                raise SystemExit(
                    f"Expected exactly one TrajectoryExecutionManager destructor anchor, found {tem_count}; "
                    "refusing to patch."
                )
            tem_source = tem_updated
            cleanup_tokens = (
                "event_topic_subscriber_.reset();",
                "callback_handler_.reset();",
                "event_callback_group_.reset();",
                "private_executor_->remove_node(controller_mgr_node_);",
                "private_executor_.reset();",
                "controller_manager_.reset();",
                "controller_mgr_node_.reset();",
            )
            if any(tem_source.count(token) != 1 for token in cleanup_tokens):
                raise SystemExit("Internal controller-manager cleanup validation failed.")
            if not (
                tem_source.index("private_executor_thread_.join();")
                < tem_source.index("event_topic_subscriber_.reset();")
                < tem_source.index("callback_handler_.reset();")
                < tem_source.index("event_callback_group_.reset();")
                < tem_source.index("private_executor_->remove_node(controller_mgr_node_);")
                < tem_source.index("private_executor_.reset();")
                < tem_source.index("controller_manager_.reset();")
                < tem_source.index("controller_mgr_node_.reset();")
            ):
                raise SystemExit("Internal controller-manager teardown order validation failed.")
            tem_path.write_text(tem_source)

          print("Applied TEM explicit cleanup together with main-node owner release and plugin-loader ordering changes.")
          print("Retained stock MoveIt Jazzy signal handling; no signal-wait patch was applied.")
          print("Validated unique include/init/executor/spin/main anchors and deferred context shutdown.")
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.hpp

      - name: Add deterministic TEM stopExecution race barrier (CI overlay only)
        shell: bash
        run: |
          set -eo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tem_path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp")
          source = tem_path.read_text()

          include_anchor = "#include <memory>\n"
          include_extra = "#include <chrono>\n#include <cstdio>\n#include <cstdlib>\n#include <fstream>\n#include <string>\n#include <thread>\n"
          if source.count(include_anchor) != 1:
              raise SystemExit("Expected unique TEM standard include anchor.")
          source = source.replace(include_anchor, include_extra + include_anchor, 1)

          function_start = source.index("void TrajectoryExecutionManager::stopExecution(bool auto_clear)")
          function_end = source.index("\nvoid TrajectoryExecutionManager::execute(", function_start)
          stop_function = """void TrajectoryExecutionManager::stopExecution(bool auto_clear)
          {
            bool test_barrier_entered = false;
            bool test_join_performed = false;
            const char* test_barrier_dir = std::getenv("STAUBLI_TEM_STOP_BARRIER_DIR");
            std::string marker_prefix;
            if (test_barrier_dir && *test_barrier_dir)
            {
              marker_prefix = std::string(test_barrier_dir) + "/";
              std::ifstream arm(marker_prefix + "arm");
              if (arm.good())
              {
                std::remove((marker_prefix + "arm").c_str());
                test_barrier_entered = true;
                { std::ofstream marker(marker_prefix + "entered"); marker << 1 << std::endl; }
                const auto deadline = std::chrono::steady_clock::now() + std::chrono::seconds(45);
                bool released = false;
                while (std::chrono::steady_clock::now() < deadline)
                {
                  std::ifstream release(marker_prefix + "release");
                  if (release.good()) { released = true; break; }
                  std::this_thread::sleep_for(std::chrono::milliseconds(10));
                }
                { std::ofstream marker(marker_prefix + "released"); marker << (released ? 1 : 0) << std::endl; }
              }
            }

            bool stop_requested = false;
            {
              std::scoped_lock state_lock(execution_state_mutex_);
              if (!execution_complete_)
              {
                execution_complete_ = true;
                stopExecutionInternal();
                last_execution_status_ = moveit_controller_manager::ExecutionStatus::PREEMPTED;
                stop_requested = true;
              }
            }
            if (stop_requested)
              RCLCPP_INFO(logger_, "Stopped trajectory execution.");

            // Always join a completed execution thread, including when natural
            // completion wins before the state lock is acquired.
            {
              std::scoped_lock thread_lock(execution_thread_mutex_);
              if (execution_thread_)
              {
                execution_thread_->join();
                execution_thread_.reset();
                test_join_performed = true;
              }
            }

            if (stop_requested && auto_clear)
              clear();

            if (test_barrier_entered)
            {
              bool thread_joinable = false;
              std::size_t handle_count = 0;
              { std::lock_guard<std::mutex> thread_lock(execution_thread_mutex_); thread_joinable = execution_thread_ && execution_thread_->joinable(); }
              { std::lock_guard<std::mutex> state_lock(execution_state_mutex_); handle_count = active_handles_.size(); }
              std::ofstream marker(marker_prefix + "state");
              marker << "execution_thread_joinable=" << (thread_joinable ? 1 : 0) << std::endl;
              marker << "active_handles=" << handle_count << std::endl;
              marker << "join_performed=" << (test_join_performed ? 1 : 0) << std::endl;
            }
          }
          """
          source = source[:function_start] + stop_function + source[function_end:]

          thread_end_anchor = "  if (callback)\n    callback(last_execution_status_);\n}"
          thread_end_marker = (
              "  if (callback)\n    callback(last_execution_status_);\n"
              "  if (const char* barrier_dir = std::getenv(\"STAUBLI_TEM_STOP_BARRIER_DIR\"))\n"
              "  {\n"
              "    std::ofstream marker(std::string(barrier_dir) + \"/thread_finished\");\n"
              "    marker << 1 << std::endl;\n"
              "  }\n}"
          )
          if source.count(thread_end_anchor) != 1:
              raise SystemExit("Expected unique executeThread completion callback anchor.")
          source = source.replace(thread_end_anchor, thread_end_marker, 1)
          if not all(token in source for token in ("STAUBLI_TEM_STOP_BARRIER_DIR", "thread_finished", "execution_thread_joinable=", "join_performed=")):
              raise SystemExit("TEM join-fix self-validation failed.")
          tem_path.write_text(source)
          print("Installed CI-only stopExecution always-join candidate with deterministic completion barrier and join-result marker.")
          PY
      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git init /tmp/staubli_ws/src/staubli_driver_ros2
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 remote add origin https://github.com/rexyll/staubli_driver_ros2_from_org.git
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 fetch --depth 1 origin 7d9fa0d715db46060199eeca541514ddeed9c4c1
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse HEAD)" = "7d9fa0d715db46060199eeca541514ddeed9c4c1"
          test_file="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 ls-files '*test_moveit_mock_planning.launch.py')"
          test_file_count="$(printf '%s\n' "$test_file" | sed '/^$/d' | wc -l)"
          test "$test_file_count" -eq 1
          test_blob="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse "HEAD:$test_file")"
          test "$test_blob" = "2f23d471e2c2dd6ee9e6e5a9560bac88e5cdf14b"
          if grep -Eiq 'SwitchController|deactivate_controllers|switch_controller' "/tmp/staubli_ws/src/staubli_driver_ros2/$test_file"; then
            echo "Unexpected test-side controller-deactivation logic in the PR launch test."
            exit 1
          fi
          echo "Verified PR launch test blob: $test_blob ($test_file); no test-side controller deactivation."
          echo "Verified original PR launch-test blob; adding a separate plan-and-execute test overlay (no controller-deactivation injection)."
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import os

          test_path = Path("/tmp/staubli_ws/src/staubli_driver_ros2/staubli_moveit_config/test/test_moveit_mock_planning.launch.py")
          source = test_path.read_text()
          shutdown_anchor = "\n\n@launch_testing.post_shutdown_test()\n"
          if source.count(shutdown_anchor) != 1:
              raise SystemExit("Unexpected launch-test structure; refusing to add execution coverage.")

          normal_method = '''
              def test_z_move_group_executes_joint_goal_on_mock_controller(self):
                  """Run a normal MoveGroup plan-and-execute request on mock hardware."""
                  client = ActionClient(self.node, MoveGroup, "/move_action")
                  self.assertTrue(client.wait_for_server(timeout_sec=120.0))
                  goal = MoveGroup.Goal()
                  goal.request.group_name = "arm"
                  goal.request.pipeline_id = "ompl"
                  goal.request.allowed_planning_time = 10.0
                  goal.request.num_planning_attempts = 2
                  goal.request.max_velocity_scaling_factor = 0.5
                  goal.request.max_acceleration_scaling_factor = 0.5
                  goal.request.start_state.is_diff = True
                  constraints = Constraints()
                  target_positions = (0.11, 0.21, 0.31, 0.41, 0.51, 0.61)
                  for index, position in enumerate(target_positions, start=1):
                      joint = JointConstraint()
                      joint.joint_name = f"joint_{index}"
                      joint.position = position
                      joint.tolerance_above = 0.05
                      joint.tolerance_below = 0.05
                      joint.weight = 1.0
                      constraints.joint_constraints.append(joint)
                  goal.request.goal_constraints.append(constraints)
                  goal.planning_options.plan_only = False
                  goal.planning_options.replan = False
                  goal.planning_options.look_around = False
                  send_future = client.send_goal_async(goal)
                  rclpy.spin_until_future_complete(self.node, send_future, timeout_sec=30.0)
                  self.assertTrue(send_future.done())
                  goal_handle = send_future.result()
                  self.assertIsNotNone(goal_handle)
                  self.assertTrue(goal_handle.accepted)
                  result_future = goal_handle.get_result_async()
                  rclpy.spin_until_future_complete(self.node, result_future, timeout_sec=120.0)
                  self.assertTrue(result_future.done())
                  result = result_future.result().result
                  self.assertEqual(result.error_code.val, MoveItErrorCodes.SUCCESS)
                  self.assertTrue(result.planned_trajectory.joint_trajectory.points)
          '''

          race_method = '''
              def test_zz_move_group_cancel_completed_thread_is_joined(self):
                  """Pause stopExecution before its state lock, finish the trajectory, and require an immediate join."""
                  barrier_dir = os.environ.get("STAUBLI_TEM_STOP_BARRIER_DIR")
                  self.assertTrue(barrier_dir, "TEM stop barrier directory was not configured")
                  os.makedirs(barrier_dir, exist_ok=True)
                  for marker_name in ("arm", "entered", "release", "released", "thread_finished", "state"):
                      marker_path = os.path.join(barrier_dir, marker_name)
                      if os.path.exists(marker_path):
                          os.remove(marker_path)

                  client = ActionClient(self.node, MoveGroup, "/move_action")
                  self.assertTrue(client.wait_for_server(timeout_sec=120.0))
                  feedback_state = {"value": ""}
                  def feedback_callback(message):
                      feedback_state["value"] = message.feedback.state

                  goal = MoveGroup.Goal()
                  goal.request.group_name = "arm"
                  goal.request.pipeline_id = "ompl"
                  goal.request.allowed_planning_time = 10.0
                  goal.request.num_planning_attempts = 2
                  goal.request.max_velocity_scaling_factor = 0.05
                  goal.request.max_acceleration_scaling_factor = 0.05
                  goal.request.start_state.is_diff = True
                  constraints = Constraints()
                  target_positions = (0.55, 0.40, 0.15, 0.25, 0.35, 0.45)
                  for index, position in enumerate(target_positions, start=1):
                      joint = JointConstraint()
                      joint.joint_name = f"joint_{index}"
                      joint.position = position
                      joint.tolerance_above = 0.05
                      joint.tolerance_below = 0.05
                      joint.weight = 1.0
                      constraints.joint_constraints.append(joint)
                  goal.request.goal_constraints.append(constraints)
                  goal.planning_options.plan_only = False
                  goal.planning_options.replan = False
                  goal.planning_options.look_around = False
                  send_future = client.send_goal_async(goal, feedback_callback=feedback_callback)
                  rclpy.spin_until_future_complete(self.node, send_future, timeout_sec=30.0)
                  self.assertTrue(send_future.done())
                  goal_handle = send_future.result()
                  self.assertIsNotNone(goal_handle)
                  self.assertTrue(goal_handle.accepted)

                  monitor_deadline = time.monotonic() + 60.0
                  while time.monotonic() < monitor_deadline and feedback_state["value"] != "MONITOR":
                      rclpy.spin_once(self.node, timeout_sec=0.1)
                  self.assertEqual(feedback_state["value"], "MONITOR", "MoveGroup never entered MONITOR state")
                  time.sleep(0.1)
                  with open(os.path.join(barrier_dir, "arm"), "w", encoding="utf-8") as arm_file:
                      arm_file.write("1\\n")
                  cancel_future = goal_handle.cancel_goal_async()
                  rclpy.spin_until_future_complete(self.node, cancel_future, timeout_sec=15.0)
                  self.assertTrue(cancel_future.done(), "MoveGroup cancel request timed out")

                  def wait_for_marker(name, timeout_sec):
                      marker_path = os.path.join(barrier_dir, name)
                      deadline = time.monotonic() + timeout_sec
                      while time.monotonic() < deadline and not os.path.exists(marker_path):
                          rclpy.spin_once(self.node, timeout_sec=0.1)
                      return os.path.exists(marker_path)

                  self.assertTrue(wait_for_marker("entered", 20.0), "TEM stopExecution barrier was not entered")
                  self.assertTrue(wait_for_marker("thread_finished", 35.0), "TEM execution thread did not naturally finish")
                  with open(os.path.join(barrier_dir, "release"), "w", encoding="utf-8") as release_file:
                      release_file.write("release\\n")
                  self.assertTrue(wait_for_marker("released", 5.0), "TEM barrier release was not observed")
                  with open(os.path.join(barrier_dir, "released"), encoding="utf-8") as released_file:
                      self.assertEqual(released_file.read().strip(), "1", "TEM barrier did not observe release")
                  self.assertTrue(wait_for_marker("state", 10.0), "TEM post-barrier state marker was not written")
                  with open(os.path.join(barrier_dir, "state"), encoding="utf-8") as state_file:
                      state_text = state_file.read()
                  self.assertIn("execution_thread_joinable=0", state_text, state_text)
                  self.assertIn("active_handles=0", state_text, state_text)
                  self.assertIn("join_performed=1", state_text, state_text)
                  result_future = goal_handle.get_result_async()
                  rclpy.spin_until_future_complete(self.node, result_future, timeout_sec=30.0)
                  self.assertTrue(result_future.done(), "Preempted MoveGroup action result timed out")
                  self.assertEqual(result_future.result().result.error_code.val, MoveItErrorCodes.PREEMPTED)
          '''

          source = source.replace(shutdown_anchor, "\n\n" + normal_method + "\n\n" + race_method + shutdown_anchor, 1)
          ast.parse(source, filename=str(test_path))
          test_path.write_text(source)
          print("Added normal mock execution plus deterministic MoveGroup cancel/TEM immediate-join regression.")
          PY
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=ON

      - name: Run mock planning, trajectory execution and strict teardown regression
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          unset LD_PRELOAD ASAN_OPTIONS
          echo "Running native non-ASan mock planning + trajectory execution + strict teardown regression."
          export STAUBLI_MOVE_GROUP_GDB_PREFIX='gdb -q -batch -return-child-result -ex "set pagination off" -ex "disable pretty-printer" -ex "set print pretty off" -ex "set print elements 0" -ex "handle SIGINT nostop noprint pass" -ex "set environment LD_DEBUG files" -ex run -ex "bt full" -ex "frame 0" -ex "info args" -ex "p/x this" -ex "x/8gx this" -ex "p/x *(void**)this" -ex "info proc mappings" -ex "x/16i $pc-32" -ex "info registers" -ex "thread apply all bt 40" --args'
          cd /tmp/staubli_ws
          failures=0
          for iteration in 1 2 3 4 5; do
            echo "=== Mock planning + trajectory execution + teardown repetition ${iteration}/5 ==="
            export STAUBLI_TEM_STOP_BARRIER_DIR="/tmp/staubli_tem_barrier_${iteration}"
            rm -rf "${STAUBLI_TEM_STOP_BARRIER_DIR}"
            mkdir -p "${STAUBLI_TEM_STOP_BARRIER_DIR}"
            set +e
            colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure
            test_rc=$?
            colcon test-result --verbose
            result_rc=$?
            set -e
            echo "=== Repetition ${iteration}/5 exit summary: colcon_test=${test_rc}, test_result=${result_rc} ==="
            if [ "${test_rc}" -ne 0 ] || [ "${result_rc}" -ne 0 ]; then
              failures=$((failures + 1))
              echo "Repetition ${iteration}/5 failed; continuing to collect remaining repetitions."
            fi
          done
          echo "=== Mock plan-and-execute teardown repetitions complete: failures=${failures}/5 ==="
          test "${failures}" -eq 0

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/rclcpp_ws/log
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
            /tmp/staubli_tem_barrier_*
          if-no-files-found: ignore

name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"
      - "experiment/moveit-main-owner-lifetime-only"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git gdb python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch and build unmodified ROS 2 Jazzy rclcpp overlay (no ASan)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp")
          required = [
              root / "callback_group.cpp",
              root / "guard_condition.cpp",
              root / "executors" / "executor_notify_waitable.cpp",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Expected Jazzy rclcpp sources missing: {missing}")
          # Add CI-only lifecycle markers to the temporary rclcpp overlay.
          executor_path = root / "executor.cpp"
          executor_source = executor_path.read_text()
          if "#include <cstdio>" not in executor_source:
              executor_source = executor_source.replace(
                  "#include <cassert>\n",
                  "#include <cassert>\n#include <cstdio>\n",
                  1,
              )
          executor_begin = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          executor_begin_marked = (
              "Executor::~Executor()\n"
              "{\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body BEGIN\\n\");\n"
              "  std::fflush(stderr);\n"
              "  std::lock_guard<std::mutex> guard(mutex_);"
          )
          if executor_source.count(executor_begin) != 1:
              raise SystemExit("Expected exactly one Executor destructor entry; refusing to instrument.")
          executor_source = executor_source.replace(executor_begin, executor_begin_marked, 1)
          executor_end = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "}"
          )
          executor_end_marked = (
              "  if (!context_->remove_on_shutdown_callback(shutdown_callback_handle_)) {\n"
              "    RCUTILS_LOG_ERROR_NAMED(\n"
              "      \"rclcpp\",\n"
              "      \"failed to remove registered on_shutdown callback\");\n"
              "    rcl_reset_error();\n"
              "  }\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] Executor dtor body END; WaitSet member destruction follows\\n\");\n"
              "  std::fflush(stderr);\n"
              "}"
          )
          if executor_source.count(executor_end) != 1:
              raise SystemExit("Expected exactly one Executor destructor exit; refusing to instrument.")
          executor_source = executor_source.replace(executor_end, executor_end_marked, 1)
          executor_path.write_text(executor_source)

          # Instrument each weak Waitable release in CallbackGroup's destructor.
          callback_group_path = root / "callback_group.cpp"
          callback_group_source = callback_group_path.read_text()
          if "#include <cstdio>" not in callback_group_source:
              callback_group_source = "#include <cstdio>\n" + callback_group_source
          callback_group_old = (
              "CallbackGroup::~CallbackGroup()\n"
              "{\n"
              "  trigger_notify_guard_condition();\n"
              "}"
          )
          callback_group_new = (
              "CallbackGroup::~CallbackGroup()\n"
              "{\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] CallbackGroup dtor BEGIN this=%p waitables=%zu\\n\", "
              "static_cast<void *>(this), waitable_ptrs_.size());\n"
              "  std::fflush(stderr);\n"
              "  trigger_notify_guard_condition();\n"
              "  while (!waitable_ptrs_.empty()) {\n"
              "    const std::size_t slot = waitable_ptrs_.size() - 1;\n"
              "    auto & weak_waitable = waitable_ptrs_.back();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] CallbackGroup weak Waitable release BEGIN slot=%zu expired=%d use_count=%ld\\n\", "
              "slot, weak_waitable.expired() ? 1 : 0, weak_waitable.use_count());\n"
              "    std::fflush(stderr);\n"
              "    weak_waitable.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] CallbackGroup weak Waitable release END slot=%zu\\n\", slot);\n"
              "    std::fflush(stderr);\n"
              "    waitable_ptrs_.pop_back();\n"
              "  }\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] CallbackGroup dtor weak Waitables CLEARED this=%p\\n\", "
              "static_cast<void *>(this));\n"
              "  std::fflush(stderr);\n"
              "}"
          )
          if callback_group_source.count(callback_group_old) != 1:
              raise SystemExit("Expected exactly one CallbackGroup destructor anchor; refusing to instrument.")
          callback_group_source = callback_group_source.replace(callback_group_old, callback_group_new, 1)

          # Single functional counter-test: remove expired Waitable weak entries during
          # remove_waitable(), before attempting to match the still-live target.
          remove_waitable_old = (
              "void\n"
              "CallbackGroup::remove_waitable(const rclcpp::Waitable::SharedPtr waitable_ptr) noexcept\n"
              "{\n"
              "  std::lock_guard<std::mutex> lock(mutex_);\n"
              "  for (auto iter = waitable_ptrs_.begin(); iter != waitable_ptrs_.end(); ++iter) {\n"
              "    const auto shared_ptr = iter->lock();\n"
              "    if (shared_ptr.get() == waitable_ptr.get()) {\n"
              "      waitable_ptrs_.erase(iter);\n"
              "      break;\n"
              "    }\n"
              "  }\n"
              "}\n"
          )
          remove_waitable_new = (
              "void\n"
              "CallbackGroup::remove_waitable(const rclcpp::Waitable::SharedPtr waitable_ptr) noexcept\n"
              "{\n"
              "  std::lock_guard<std::mutex> lock(mutex_);\n"
              "  for (auto iter = waitable_ptrs_.begin(); iter != waitable_ptrs_.end();) {\n"
              "    const auto shared_ptr = iter->lock();\n"
              "    if (!shared_ptr) {\n"
              "      iter = waitable_ptrs_.erase(iter);\n"
              "      std::fprintf(stderr, \"[PRUNE] CallbackGroup::remove_waitable erased expired weak Waitable group=%p target=%p remaining=%zu\\n\", "
              "        static_cast<void *>(this), static_cast<void *>(waitable_ptr.get()), waitable_ptrs_.size());\n"
              "      std::fflush(stderr);\n"
              "      continue;\n"
              "    }\n"
              "    if (shared_ptr.get() == waitable_ptr.get()) {\n"
              "      waitable_ptrs_.erase(iter);\n"
              "      break;\n"
              "    }\n"
              "    ++iter;\n"
              "  }\n"
              "}\n"
          )
          if callback_group_source.count(remove_waitable_old) != 1:
              raise SystemExit("Expected exactly one stock remove_waitable body; refusing to apply pruning.")
          callback_group_source = callback_group_source.replace(remove_waitable_old, remove_waitable_new, 1)
          if callback_group_source.count("[PRUNE] CallbackGroup::remove_waitable erased expired weak Waitable") != 1:
              raise SystemExit("Expired Waitable pruning marker validation failed.")
          callback_group_path.write_text(callback_group_source)
          print("Applied the sole functional counter-test: prune expired weak Waitables in remove_waitable().")

          # NodeBase destructor body ends before its members (including the default group)
          # are destroyed; these markers make that boundary explicit.
          node_base_path = root / "node_interfaces" / "node_base.cpp"
          node_base_source = node_base_path.read_text()
          if "#include <cstdio>" not in node_base_source:
              node_base_source = "#include <cstdio>\n" + node_base_source
          node_base_old = (
              "NodeBase::~NodeBase()\n"
              "{\n"
              "  // Finalize the interrupt guard condition after removing self from graph listener.\n"
              "  {\n"
              "    std::lock_guard<std::recursive_mutex> notify_condition_lock(notify_guard_condition_mutex_);\n"
              "    notify_guard_condition_is_valid_ = false;\n"
              "  }\n"
              "}"
          )
          node_base_new = (
              "NodeBase::~NodeBase()\n"
              "{\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] NodeBase dtor BEGIN this=%p default_group=%p default_use_count=%ld weak_groups=%zu\\n\", "
              "static_cast<void *>(this), static_cast<void *>(default_callback_group_.get()), "
              "default_callback_group_.use_count(), callback_groups_.size());\n"
              "  std::fflush(stderr);\n"
              "  // Finalize the interrupt guard condition after removing self from graph listener.\n"
              "  {\n"
              "    std::lock_guard<std::recursive_mutex> notify_condition_lock(notify_guard_condition_mutex_);\n"
              "    notify_guard_condition_is_valid_ = false;\n"
              "  }\n"
              "  std::fprintf(stderr, \"[LIFECYCLE] NodeBase dtor BODY END this=%p; members follow\\n\", "
              "static_cast<void *>(this));\n"
              "  std::fflush(stderr);\n"
              "}"
          )
          if node_base_source.count(node_base_old) != 1:
              raise SystemExit("Expected exactly one NodeBase destructor anchor; refusing to instrument.")
          node_base_source = node_base_source.replace(node_base_old, node_base_new, 1)
          node_base_path.write_text(node_base_source)

          print("Applied CI-only Executor, CallbackGroup weak-Waitable, expired-entry pruning, and NodeBase lifecycle markers; upstream repository remains untouched.")
          PY
          rosdep install --from-paths /tmp/rclcpp_ws/src/rclcpp/rclcpp --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-select rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply K-only plus expired-entry pruning counter-test
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          # Common K background: stop and join the PSM scene-publishing thread
          # after executor.spin() returns, before Context shutdown and executor destruction.
          # A=OFF: retain main() shared owners until normal scope exit. B=OFF: retain the
          # stock TEM destructor. The rclcpp expired-entry pruning above is the sole treatment.
          if source.count("  rclcpp::init(argc, argv);") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::init anchor.")
          if source.count("    executor.spin();") != 1:
              raise SystemExit("Expected exactly one upstream executor.spin anchor.")
          if source.count("    rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown anchor.")
          if "sigwait(" in source or "SignalHandlerOptions::None" in source:
              raise SystemExit("Unexpected custom signal handling in upstream baseline.")
          shutdown_anchor = "    rclcpp::shutdown();"
          if source.count(shutdown_anchor) != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown call.")
          insertion = """    RCLCPP_INFO(nh->get_logger(), "shutdown K: stopping PSM scene publisher before Context shutdown");
              planning_scene_monitor->stopPublishingPlanningScene();
              RCLCPP_INFO(nh->get_logger(), "shutdown K: PSM scene publisher stopped and joined");
          """
          source = source.replace(shutdown_anchor, insertion + shutdown_anchor, 1)
          if source.count("planning_scene_monitor->stopPublishingScene();") != 0:
              raise SystemExit("Unexpected alternate PSM shutdown anchor.")
          # A=OFF: leave MoveItCpp, PlanningSceneMonitor, and main node owners unchanged.
          # K background: declare MoveGroupExe before the executor,
          # so reverse destruction destroys the executor WaitSet while capability
          # plugin instances and their plugin DSOs are still alive.
          declaration_order = """    rclcpp::executors::MultiThreadedExecutor executor;

              move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);"""
          reordered_declarations = """    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);

              rclcpp::executors::MultiThreadedExecutor executor;"""
          if source.count(declaration_order) != 1:
              raise SystemExit("Expected exactly one executor/MoveGroupExe declaration pair; refusing to reorder.")
          source = source.replace(declaration_order, reordered_declarations, 1)
          if not source.index("move_group::MoveGroupExe mge") < source.index(
              "rclcpp::executors::MultiThreadedExecutor executor"
          ):
              raise SystemExit("MoveGroupExe must be declared before executor for reverse destruction order.")
          if "#include <cstdio>" not in source:
              source = source.replace("#include <memory>\n", "#include <cstdio>\n#include <memory>\n", 1)
          move_group_dtor = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    capabilities_.clear();\n"
              "    context_.reset();\n"
              "    capability_plugin_loader_.reset();\n"
              "  }"
          )
          move_group_dtor_marked = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe dtor BEGIN; capabilities=%zu loader=%d\\n\", "
              "capabilities_.size(), capability_plugin_loader_ ? 1 : 0);\n"
              "    std::fflush(stderr);\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe before capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capabilities_.clear();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    context_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after context_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capability_plugin_loader_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capability_plugin_loader_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "  }"
          )
          if source.count(move_group_dtor) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe destructor; refusing to instrument.")
          source = source.replace(move_group_dtor, move_group_dtor_marked, 1)
          path.write_text(source)
          print("Retained K scope ordering and instrumented the stock MoveGroupExe capability/loader destructor.")

          # B=OFF: deliberately leave TrajectoryExecutionManager and plugin teardown untouched.
          if not (
              "planning_scene_monitor->stopPublishingPlanningScene();" in source
              and "planning_scene_monitor.reset();" not in source
              and "moveit_cpp.reset();" not in source
              and "nh.reset();" not in source
          ):
              raise SystemExit("K-only A/B-disabled static validation failed.")
          overlay_callback_group_path = Path(
              "/tmp/rclcpp_ws/src/rclcpp/rclcpp/src/rclcpp/callback_group.cpp"
          )
          overlay_callback_group_source = overlay_callback_group_path.read_text()
          if overlay_callback_group_source.count("[PRUNE] CallbackGroup::remove_waitable erased expired weak Waitable") != 1:
              raise SystemExit("Expected exactly one expired-entry pruning treatment in the persisted rclcpp overlay.")
          print("Applied K-only background (A=OFF, B=OFF) plus the sole rclcpp expired-entry pruning treatment.")
          print("Retained stock MoveIt Jazzy signal handling; no signal-wait patch was applied.")
          print("Validated unique include/init/executor/spin/main anchors and deferred context shutdown.")
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.hpp

      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git init /tmp/staubli_ws/src/staubli_driver_ros2
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 remote add origin https://github.com/rexyll/staubli_driver_ros2_from_org.git
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 fetch --depth 1 origin 7d9fa0d715db46060199eeca541514ddeed9c4c1
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse HEAD)" = "7d9fa0d715db46060199eeca541514ddeed9c4c1"
          test_file="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 ls-files '*test_moveit_mock_planning.launch.py')"
          test_file_count="$(printf '%s\n' "$test_file" | sed '/^$/d' | wc -l)"
          test "$test_file_count" -eq 1
          test_blob="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse "HEAD:$test_file")"
          test "$test_blob" = "2f23d471e2c2dd6ee9e6e5a9560bac88e5cdf14b"
          if grep -Eiq 'SwitchController|deactivate_controllers|switch_controller' "/tmp/staubli_ws/src/staubli_driver_ros2/$test_file"; then
            echo "Unexpected test-side controller-deactivation logic in the PR launch test."
            exit 1
          fi
          echo "Verified PR launch test blob: $test_blob ($test_file); no test-side controller deactivation."
          echo "Verified original PR launch-test blob; adding a separate plan-and-execute test overlay (no controller-deactivation injection)."
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("/tmp/staubli_ws/src/staubli_driver_ros2/staubli_moveit_config/test/test_moveit_mock_planning.launch.py")
          source = test_path.read_text()

          shutdown_anchor = "\n\n@launch_testing.post_shutdown_test()\n"
          method_name = "test_z_move_group_executes_joint_goal_on_mock_controller"
          if source.count(shutdown_anchor) != 1 or method_name in source:
              raise SystemExit("Unexpected launch-test structure; refusing to add execution coverage.")

          method = '''
              def test_z_move_group_executes_joint_goal_on_mock_controller(self):
                  """Run a real MoveGroup plan-and-execute request on mock hardware."""
                  client = ActionClient(self.node, MoveGroup, "/move_action")
                  self.assertTrue(
                      client.wait_for_server(timeout_sec=120.0),
                      "MoveGroup action server did not become available for execution",
                  )

                  goal = MoveGroup.Goal()
                  goal.request.group_name = "arm"
                  goal.request.pipeline_id = "ompl"
                  goal.request.allowed_planning_time = 10.0
                  goal.request.num_planning_attempts = 2
                  goal.request.max_velocity_scaling_factor = 0.5
                  goal.request.max_acceleration_scaling_factor = 0.5
                  goal.request.start_state.is_diff = True

                  constraints = Constraints()
                  target_positions = (0.11, 0.21, 0.31, 0.41, 0.51, 0.61)
                  for index, position in enumerate(target_positions, start=1):
                      joint = JointConstraint()
                      joint.joint_name = f"joint_{index}"
                      joint.position = position
                      joint.tolerance_above = 0.05
                      joint.tolerance_below = 0.05
                      joint.weight = 1.0
                      constraints.joint_constraints.append(joint)
                  goal.request.goal_constraints.append(constraints)

                  goal.planning_options.plan_only = False
                  goal.planning_options.replan = False
                  goal.planning_options.look_around = False

                  send_future = client.send_goal_async(goal)
                  rclpy.spin_until_future_complete(self.node, send_future, timeout_sec=30.0)
                  self.assertTrue(send_future.done(), "MoveGroup execution goal submission timed out")
                  goal_handle = send_future.result()
                  self.assertIsNotNone(goal_handle)
                  self.assertTrue(goal_handle.accepted, "MoveGroup rejected the execution goal")

                  result_future = goal_handle.get_result_async()
                  rclpy.spin_until_future_complete(self.node, result_future, timeout_sec=120.0)
                  self.assertTrue(result_future.done(), "MoveGroup execution result timed out")
                  result = result_future.result().result
                  self.assertEqual(result.error_code.val, MoveItErrorCodes.SUCCESS)
                  self.assertTrue(
                      result.planned_trajectory.joint_trajectory.points,
                      "MoveIt did not return the planned trajectory",
                  )
          '''

          source = source.replace(
              shutdown_anchor,
              "\n\n" + method + shutdown_anchor,
              1,
          )
          test_path.write_text(source)
          print("Added isolated plan_only=False execution coverage after the original PR blob SHA check.")
          PY
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=ON

      - name: Run K-only mock execution, teardown and pruning-evidence regression
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          unset LD_PRELOAD ASAN_OPTIONS
          cd /tmp/staubli_ws
          package_prefix="$(ros2 pkg prefix staubli_moveit_config)"
          test -d "${package_prefix}"
          colcon list --base-paths src | awk '{print $1}' | grep -Fx "staubli_moveit_config"
          echo "Test workspace preflight passed: package=staubli_moveit_config prefix=${package_prefix} workspace=/tmp/staubli_ws"
          echo "Running K-only mock plan-and-execute with A/B disabled and rclcpp expired-weak-entry pruning as the sole functional treatment."
          failures=0
          total_prunes=0
          for iteration in 1 2 3 4 5; do
            echo "=== K-only + expired-entry pruning repetition ${iteration}/5 ==="
            output_log="/tmp/staubli_ws/k-only-pruning-${iteration}.log"
            set +e
            colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure 2>&1 | tee "${output_log}"
            test_rc=${PIPESTATUS[0]}
            set -e
            set +e
            colcon test-result --verbose 2>&1 | tee -a "${output_log}"
            result_rc=${PIPESTATUS[0]}
            set -e
            prune_count="$(grep -cF '[PRUNE] CallbackGroup::remove_waitable erased expired weak Waitable' "${output_log}" || true)"
            total_prunes=$((total_prunes + prune_count))
            echo "=== Repetition ${iteration}/5 exit summary: colcon_test=${test_rc}, test_result=${result_rc}, expired_entries_pruned=${prune_count} ==="
            if [ "${test_rc}" -ne 0 ] || [ "${result_rc}" -ne 0 ] || [ "${prune_count}" -eq 0 ]; then
              failures=$((failures + 1))
              echo "Repetition ${iteration}/5 failed or did not exercise pruning; continuing to collect remaining repetitions."
            fi
          done
          echo "=== K-only + expired-entry pruning complete: failures=${failures}/5, total_expired_entries_pruned=${total_prunes} ==="
          test "${total_prunes}" -gt 0
          test "${failures}" -eq 0

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/rclcpp_ws/log
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
            /tmp/staubli_ws/k-only-pruning-*.log
          if-no-files-found: ignore

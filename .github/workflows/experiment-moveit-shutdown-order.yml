name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"
      - "experiment/moveit-main-owner-lifetime-only"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git gdb python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          for attempt in 1 2 3 4 5; do
            if rosdep update --rosdistro jazzy; then
              echo "rosdep update succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "rosdep update attempt ${attempt}/5 failed; retrying"
            if [ "${attempt}" -lt 5 ]; then sleep 8; fi
          done
          echo "rosdep update failed after five attempts."
          exit 1

      - name: Fetch and build stock ROS 2 Jazzy rcl + rclcpp overlay (no ASan, no source instrumentation)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          # Keep the source overlay API-compatible with the checked-out Jazzy rclcpp.
          # The hosted apt underlay can lag the Jazzy source branch and omit newer rcl APIs.
          git clone --depth 1 --branch jazzy https://github.com/ros2/rcl.git /tmp/rclcpp_ws/src/rcl
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          git -C /tmp/rclcpp_ws/src/rcl diff --exit-code
          git -C /tmp/rclcpp_ws/src/rclcpp diff --exit-code
          echo "Using pristine ROS 2 Jazzy rcl + rclcpp sources; no Executor, CallbackGroup, NodeBase, or DynamicStorage instrumentation."
          rosdep install --from-paths /tmp/rclcpp_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-up-to rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply A+K+B-core cleanup probe
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          echo "MoveIt Jazzy resolved source commit: $(git -C /tmp/moveit_ws/src/moveit2 rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          # Fixed K background: stop/join the PSM scene publisher before Context shutdown.
          if source.count("  rclcpp::init(argc, argv);") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::init anchor.")
          if source.count("    executor.spin();") != 1:
              raise SystemExit("Expected exactly one upstream executor.spin anchor.")
          if source.count("    rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown anchor.")
          if "sigwait(" in source or "SignalHandlerOptions::None" in source:
              raise SystemExit("Unexpected custom signal handling in upstream baseline.")
          source = source.replace(
              "    rclcpp::shutdown();",
              """    RCLCPP_INFO(nh->get_logger(), "shutdown K: stopping PSM scene publisher before Context shutdown");
                  planning_scene_monitor->stopPublishingPlanningScene();
                  RCLCPP_INFO(nh->get_logger(), "shutdown K: PSM scene publisher stopped and joined");
                  rclcpp::shutdown();""",
              1,
          )
          if source.count("planning_scene_monitor->stopPublishingPlanningScene();") != 1:
              raise SystemExit("K PSM publisher stop patch validation failed.")

          # A-PSM-retained: keep the main() PSM alias alive beyond MoveGroupExe/executor scope;
          # continue dropping the main() MoveItCpp and node owners after Context shutdown.
          moveit_cpp_anchor = "  const auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);"
          psm_anchor = "  const auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();"
          if source.count(moveit_cpp_anchor) != 1 or source.count(psm_anchor) != 1:
              raise SystemExit("Expected unique main() MoveItCpp/PSM owner declarations.")
          source = source.replace(
              moveit_cpp_anchor,
              "  auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);",
              1,
          )
          if "#include <std_srvs/srv/trigger.hpp>" not in source:
              if source.count("#include <memory>\n") != 1:
                  raise SystemExit("Could not locate unique MoveGroup include insertion anchor.")
              source = source.replace(
                  "#include <memory>\n",
                  "#include <atomic>\n#include <chrono>\n#include <cstdlib>\n#include <cstdio>\n"
                  "#include <memory>\n#include <thread>\n"
                  "#include <moveit/planning_interface/planning_interface.hpp>\n"
                  "#include <moveit_msgs/msg/constraints.hpp>\n"
                  "#include <moveit_msgs/msg/joint_constraint.hpp>\n"
                  "#include <std_srvs/srv/trigger.hpp>\n",
                  1,
              )
          terminate_service_anchor = "  auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);\n"
          if source.count(terminate_service_anchor) != 1:
              raise SystemExit("Expected unique MoveItCpp main() owner for terminate-probe service.")
          terminate_service_patch = '''  rclcpp::Service<std_srvs::srv::Trigger>::SharedPtr staubli_terminate_probe_service;
          rclcpp::Service<std_srvs::srv::Trigger>::SharedPtr staubli_cross_pipeline_service;
          rclcpp::Service<std_srvs::srv::Trigger>::SharedPtr staubli_probe_status_service;
          rclcpp::CallbackGroup::SharedPtr staubli_probe_callback_group;
          const char* staubli_terminate_probe_env = std::getenv("STAUBLI_TERMINATE_PROBE");
          if (staubli_terminate_probe_env != nullptr && staubli_terminate_probe_env[0] == '1' &&
              staubli_terminate_probe_env[1] == '\\0')
          {
            nh->declare_parameter<bool>("staubli_test_slow_held", false);
            nh->declare_parameter<bool>("staubli_test_release_slow", false);
            nh->declare_parameter<bool>("staubli_test_cross_pipeline_held", false);
            nh->declare_parameter<bool>("staubli_test_release_cross_pipeline", false);
            nh->declare_parameter<bool>("staubli_test_multi_a_held", false);
            nh->declare_parameter<bool>("staubli_test_multi_b_held", false);
            nh->declare_parameter<bool>("staubli_test_multi_release", false);
            staubli_probe_callback_group =
                nh->create_callback_group(rclcpp::CallbackGroupType::Reentrant);
            staubli_probe_status_service = nh->create_service<std_srvs::srv::Trigger>(
                "/staubli_test_probe_status",
                [nh, moveit_cpp](const std_srvs::srv::Trigger::Request::SharedPtr& request,
                                 const std_srvs::srv::Trigger::Response::SharedPtr& response) {
                  (void)request;
                  bool slow_held = false;
                  bool cross_held = false;
                  bool multi_a_held = false;
                  bool multi_b_held = false;
                  nh->get_parameter("staubli_test_slow_held", slow_held);
                  nh->get_parameter("staubli_test_cross_pipeline_held", cross_held);
                  nh->get_parameter("staubli_test_multi_a_held", multi_a_held);
                  nh->get_parameter("staubli_test_multi_b_held", multi_b_held);
                  const auto& pipelines = moveit_cpp->getPlanningPipelines();
                  const auto ompl = pipelines.find("ompl");
                  const auto pilz = pipelines.find("pilz_industrial_motion_planner");
                  const bool ompl_active = ompl != pipelines.end() && ompl->second && ompl->second->isActive();
                  const bool pilz_active = pilz != pipelines.end() && pilz->second && pilz->second->isActive();
                  response->success = slow_held || cross_held || (multi_a_held && multi_b_held);
                  response->message = "slow_held=" + std::to_string(slow_held) +
                                      " cross_held=" + std::to_string(cross_held) +
                                      " multi_a_held=" + std::to_string(multi_a_held) +
                                      " multi_b_held=" + std::to_string(multi_b_held) +
                                      " ompl_active=" + std::to_string(ompl_active) +
                                      " pilz_active=" + std::to_string(pilz_active);
                },
                rmw_qos_profile_services_default, staubli_probe_callback_group);
            staubli_terminate_probe_service = nh->create_service<std_srvs::srv::Trigger>(
                "/staubli_test_terminate_ompl",
                [moveit_cpp, nh](const std_srvs::srv::Trigger::Request::SharedPtr& request,
                                 const std_srvs::srv::Trigger::Response::SharedPtr& response) {
                  (void)request;
                  const auto& pipelines = moveit_cpp->getPlanningPipelines();
                  for (const auto& pipeline_entry : pipelines)
                  {
                    const auto& pipeline_name = pipeline_entry.first;
                    const auto& pipeline_instance = pipeline_entry.second;
                    std::fprintf(stderr,
                                 "[STAUBLI_PIPELINE_MAP] id=%s pipeline=%p active=%d\\n",
                                 pipeline_name.c_str(), static_cast<const void*>(pipeline_instance.get()),
                                 pipeline_instance && pipeline_instance->isActive() ? 1 : 0);
                    std::fflush(stderr);
                  }
                  const auto pipeline = pipelines.find("ompl");
                  const bool active_before =
                      pipeline != pipelines.end() && pipeline->second && pipeline->second->isActive();
                  bool multi_a_held = false;
                  bool multi_b_held = false;
                  nh->get_parameter("staubli_test_multi_a_held", multi_a_held);
                  nh->get_parameter("staubli_test_multi_b_held", multi_b_held);
                  const bool multi_token_scenario = multi_a_held && multi_b_held;
                  const bool wrapper_result = moveit_cpp->terminatePlanningPipeline("ompl");
                  if (multi_token_scenario)
                    std::fprintf(stderr, "[STAUBLI_MULTI_TOKEN] WRAPPER_RETURN active_before=%d result=%d\\n",
                                 active_before ? 1 : 0, wrapper_result ? 1 : 0);
                  else
                    std::fprintf(stderr, "[STAUBLI_TERMINATE_PROBE] WRAPPER_RETURN active_before=%d result=%d\\n",
                                 active_before ? 1 : 0, wrapper_result ? 1 : 0);
                  std::fflush(stderr);
                  const bool token_lifecycle_ok =
                      pipeline != pipelines.end() && pipeline->second &&
                      pipeline->second->staubliTestRequestTokenLifecycle();
                  std::fprintf(stderr, "[STAUBLI_TOKEN_LIFECYCLE] pass=%d\\n", token_lifecycle_ok ? 1 : 0);
                  std::fflush(stderr);
                  response->success = wrapper_result && token_lifecycle_ok;
                  response->message = "MoveItCpp terminatePlanningPipeline invoked; token lifecycle probe " +
                                      std::string(token_lifecycle_ok ? "passed" : "failed");
                  if (multi_token_scenario)
                  {
                    const auto multi_release_result =
                        nh->set_parameter(rclcpp::Parameter("staubli_test_multi_release", true));
                    std::fprintf(stderr, "[STAUBLI_MULTI_TOKEN] RELEASE signal=%d\\n",
                                 multi_release_result.successful ? 1 : 0);
                  }
                  const auto release_result =
                      nh->set_parameter(rclcpp::Parameter("staubli_test_release_slow", true));
                  std::fprintf(stderr, "[STAUBLI_TERMINATE_PROBE] RELEASE slow=%d\\n",
                               release_result.successful ? 1 : 0);
                  std::fflush(stderr);
                }, rmw_qos_profile_services_default, staubli_probe_callback_group);
            staubli_cross_pipeline_service = nh->create_service<std_srvs::srv::Trigger>(
                "/staubli_test_cross_pipeline_terminate",
                [moveit_cpp, nh](const std_srvs::srv::Trigger::Request::SharedPtr& request,
                                 const std_srvs::srv::Trigger::Response::SharedPtr& response) {
                  (void)request;
                  const auto pipelines = moveit_cpp->getPlanningPipelines();
                  const auto ompl = pipelines.find("ompl");
                  const auto pilz = pipelines.find("pilz_industrial_motion_planner");
                  const bool active_before =
                      ompl != pipelines.end() && ompl->second && ompl->second->isActive();
                  if (!active_before || pilz == pipelines.end() || !pilz->second ||
                      pilz->second->getPlannerPluginNames().empty())
                  {
                    response->success = false;
                    response->message = "precondition failed: OMPL active and Pilz pipeline required";
                    nh->set_parameter(rclcpp::Parameter("staubli_test_release_cross_pipeline", true));
                    return;
                  }
                  const auto& planner_name = pilz->second->getPlannerPluginNames().front();
                  const auto planner_manager = pilz->second->getPlannerManager(planner_name);
                  const auto psm = moveit_cpp->getPlanningSceneMonitorNonConst();
                  const auto scene = psm ? psm->getPlanningScene() : nullptr;
                  if (!planner_manager || !scene)
                  {
                    response->success = false;
                    response->message = "Pilz PlannerManager or PlanningScene unavailable";
                    nh->set_parameter(rclcpp::Parameter("staubli_test_release_cross_pipeline", true));
                    return;
                  }
                  planning_interface::MotionPlanRequest pilz_request;
                  pilz_request.group_name = "arm";
                  pilz_request.planner_id = "PTP";
                  pilz_request.allowed_planning_time = 7.734;
                  pilz_request.num_planning_attempts = 1;
                  pilz_request.start_state.is_diff = true;
                  pilz_request.max_velocity_scaling_factor = 0.5;
                  pilz_request.max_acceleration_scaling_factor = 0.5;
                  moveit_msgs::msg::Constraints goal;
                  const double target_positions[] = { 0.11, 0.21, 0.31, 0.41, 0.51, 0.61 };
                  for (std::size_t index = 0; index < 6; ++index)
                  {
                    moveit_msgs::msg::JointConstraint joint;
                    joint.joint_name = "joint_" + std::to_string(index + 1);
                    joint.position = target_positions[index];
                    joint.tolerance_above = 0.05;
                    joint.tolerance_below = 0.05;
                    joint.weight = 1.0;
                    goal.joint_constraints.push_back(joint);
                  }
                  pilz_request.goal_constraints.push_back(goal);
                  std::atomic_bool pilz_request_done{ false };
                  planning_interface::MotionPlanResponse inflight_response;
                  const auto pilz_pipeline = pilz->second;
                  std::thread inflight_solve_thread(
                      [pilz_pipeline, scene, pilz_request, &inflight_response, &pilz_request_done]() {
                        pilz_pipeline->generatePlan(scene, pilz_request, inflight_response);
                        pilz_request_done.store(true);
                      });
                  planning_interface::PlanningContextPtr target_context;
                  planning_interface::StaubliSolveBarrierProbe* solve_barrier = nullptr;
                  const auto solve_deadline = std::chrono::steady_clock::now() + std::chrono::seconds(10);
                  while (std::chrono::steady_clock::now() < solve_deadline)
                  {
                    target_context = pilz_pipeline->staubliTestLatestContext();
                    solve_barrier = target_context ?
                        dynamic_cast<planning_interface::StaubliSolveBarrierProbe*>(target_context.get()) : nullptr;
                    if (solve_barrier && solve_barrier->staubliSolveBarrierEntered())
                      break;
                    std::this_thread::sleep_for(std::chrono::milliseconds(1));
                  }
                  const bool inflight_entered = solve_barrier && solve_barrier->staubliSolveBarrierEntered();
                  if (!inflight_entered)
                  {
                    if (solve_barrier)
                      solve_barrier->releaseStaubliSolveBarrier();
                    if (inflight_solve_thread.joinable())
                      inflight_solve_thread.join();
                    response->success = false;
                    response->message = "Pilz generatePlan did not enter the deterministic in-flight barrier";
                    nh->set_parameter(rclcpp::Parameter("staubli_test_release_cross_pipeline", true));
                    return;
                  }
                  std::fprintf(stderr, "[STAUBLI_CROSS_PIPELINE] B_CONTEXT_CREATED context=%p\\n",
                               static_cast<const void*>(target_context.get()));
                  std::fflush(stderr);
                  const bool pilz_active_before = pilz_pipeline->isActive();
                  std::fprintf(stderr,
                               "[STAUBLI_CROSS_PIPELINE] B_PIPELINE_REQUEST_ACTIVE active=%d context=%p\\n",
                               pilz_active_before ? 1 : 0, static_cast<const void*>(target_context.get()));
                  std::fflush(stderr);
                  const bool wrapper_result = moveit_cpp->terminatePlanningPipeline("ompl");
                  std::fprintf(stderr, "[STAUBLI_CROSS_PIPELINE] A_WRAPPER_RETURN active_before=%d result=%d\\n",
                               active_before ? 1 : 0, wrapper_result ? 1 : 0);
                  std::fflush(stderr);
                  const bool inflight_done_while_held = pilz_request_done.load();
                  const bool terminated_while_held = solve_barrier->staubliContextTerminated();
                  std::fprintf(stderr,
                               "[STAUBLI_PILZ_INFLIGHT] TERMINATE_OBSERVED context=%p terminated=%d solve_done=%d\\n",
                               static_cast<const void*>(target_context.get()), terminated_while_held ? 1 : 0,
                               inflight_done_while_held ? 1 : 0);
                  std::fflush(stderr);
                  solve_barrier->releaseStaubliSolveBarrier();
                  if (inflight_solve_thread.joinable())
                    inflight_solve_thread.join();
                  const bool inflight_success =
                      inflight_response.error_code.val == moveit_msgs::msg::MoveItErrorCodes::SUCCESS;
                  std::fprintf(stderr,
                               "[STAUBLI_PILZ_INFLIGHT] SOLVE_RELEASED context=%p success=%d code=%d\\n",
                               static_cast<const void*>(target_context.get()), inflight_success ? 1 : 0,
                               inflight_response.error_code.val);
                  std::fprintf(stderr, "[STAUBLI_CROSS_PIPELINE] B_TARGET_SOLVE context=%p success=%d code=%d\\n",
                               static_cast<const void*>(target_context.get()), inflight_success ? 1 : 0,
                               inflight_response.error_code.val);
                  std::fflush(stderr);
                  moveit_msgs::msg::MoveItErrorCodes control_error;
                  auto control_context =
                      planner_manager->getPlanningContext(scene, pilz_request, control_error);
                  bool control_success = false;
                  if (control_context)
                  {
                    planning_interface::MotionPlanResponse control_response;
                    control_context->solve(control_response);
                    control_success =
                        control_response.error_code.val == moveit_msgs::msg::MoveItErrorCodes::SUCCESS;
                  }
                  std::fprintf(stderr, "[STAUBLI_CROSS_PIPELINE] B_CONTROL_SOLVE success=%d\\n",
                               control_success ? 1 : 0);
                  std::fflush(stderr);
                  response->success = active_before && wrapper_result && inflight_entered &&
                                      pilz_active_before && !inflight_done_while_held &&
                                      !terminated_while_held && inflight_success && control_success;
                  response->message =
                      "active=" + std::to_string(active_before) +
                      " wrapper=" + std::to_string(wrapper_result) +
                      " inflight_entered=" + std::to_string(inflight_entered) +
                      " inflight_done_while_held=" + std::to_string(inflight_done_while_held) +
                      " terminated=" + std::to_string(terminated_while_held) +
                      " inflight_success=" + std::to_string(inflight_success) +
                      " target_unterminated=" + std::to_string(!terminated_while_held) +
                      " control_success=" + std::to_string(control_success);
                  const auto release_result =
                      nh->set_parameter(rclcpp::Parameter("staubli_test_release_cross_pipeline", true));
                  std::fprintf(stderr, "[STAUBLI_CROSS_PIPELINE] RELEASE signal=%d\\n",
                               release_result.successful ? 1 : 0);
                  std::fflush(stderr);
                }, rmw_qos_profile_services_default, staubli_probe_callback_group);
          }
          '''
          source = source.replace(
              terminate_service_anchor,
              terminate_service_anchor + terminate_service_patch,
              1,
          )
          if not (
              "staubli_test_terminate_ompl" in source
              and "staubli_test_cross_pipeline_terminate" in source
              and "staubli_test_multi_a_held" in source
              and "staubli_test_multi_b_held" in source
              and "staubli_test_multi_release" in source
              and "staubli_test_probe_status" in source
              and "CallbackGroupType::Reentrant" in source
              and "staubli_probe_status_service" in source
              and "terminatePlanningPipeline" in source
          ):
              raise SystemExit("MoveItCpp terminate-probe service static validation failed.") 
          # Keep the PSM strongly owned through MoveGroupExe/executor destruction,
          # then explicitly reset it after recording the weak-only use count.
          source = source.replace(
              psm_anchor,
              "  auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();\n  const auto planning_scene_monitor_lifetime = std::weak_ptr(planning_scene_monitor);",
              1,
          )
          source = source.replace(
              "    rclcpp::shutdown();",
              """    rclcpp::shutdown();
                  staubli_terminate_probe_service.reset();
                  staubli_cross_pipeline_service.reset();
                  staubli_probe_status_service.reset();
                  moveit_cpp.reset();
                  nh.reset();""",
              1,
          )
          after_scope_anchor = (
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n"
              "\n"
              "  return 0;"
          )
          after_scope_probe = (
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n"
              "\n"
              "  if (planning_scene_monitor_lifetime.expired()) {\n"
              "    std::fprintf(stderr, \"[OWNER] PSM unexpectedly expired before main() return\\\\n\");\n"
              "    std::fflush(stderr);\n"
              "    return 2;\n"
              "  }\n"
              "  std::fprintf(stderr, \"[OWNER] PSM retained after MoveGroupExe/executor scope; use_count=%ld\\\\n\",\n"
              "    planning_scene_monitor_lifetime.use_count());\n"
              "  std::fflush(stderr);\n"
              "  std::fprintf(stderr, \"[OWNER] PSM explicit reset BEGIN use_count=%ld\\n\", planning_scene_monitor.use_count());\n"
              "  std::fflush(stderr);\n"
              "  planning_scene_monitor.reset();\n"
              "  std::fprintf(stderr, \"[OWNER] PSM explicit reset END\\n\");\n"
              "  std::fflush(stderr);\n"
              "\n"
              "  return 0;"
          )
          if source.count(after_scope_anchor) != 1:
              raise SystemExit("Expected exactly one post-MoveGroupExe scope anchor for PSM weak probe.")
          source = source.replace(after_scope_anchor, after_scope_probe, 1)
          if not (
              source.count("planning_scene_monitor.reset();") == 1
              and "moveit_cpp.reset();" in source
              and "nh.reset();" in source
              and "planning_scene_monitor_lifetime.expired()" in source
              and "[OWNER] PSM retained after MoveGroupExe/executor scope" in source
          ):
              raise SystemExit("A-PSM-retained owner treatment / weak-lifetime probe validation failed.")

          # Keep K executor/capability scope order: executor WaitSet is destroyed
          # before MoveGroupExe capability plugins and their loader.
          declaration_order = """    rclcpp::executors::MultiThreadedExecutor executor;

              move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);"""
          reordered_declarations = """    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);

              rclcpp::executors::MultiThreadedExecutor executor;"""
          if source.count(declaration_order) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe/executor declaration pair.")
          source = source.replace(declaration_order, reordered_declarations, 1)
          if not source.index("move_group::MoveGroupExe mge") < source.index(
              "rclcpp::executors::MultiThreadedExecutor executor"
          ):
              raise SystemExit("K MoveGroupExe/executor scope order validation failed.")

          if "#include <cstdio>" not in source:
              source = source.replace("#include <memory>\n", "#include <cstdio>\n#include <memory>\n", 1)
          move_group_dtor = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    capabilities_.clear();\n"
              "    context_.reset();\n"
              "    capability_plugin_loader_.reset();\n"
              "  }"
          )
          move_group_dtor_marked = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe dtor BEGIN; capabilities=%zu loader=%d\\n\", "
              "      capabilities_.size(), capability_plugin_loader_ ? 1 : 0);\n"
              "    std::fflush(stderr);\n"
              "    capabilities_.clear();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    context_.reset();\n"

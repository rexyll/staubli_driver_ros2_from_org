name: MoveIt shutdown-order experiment

on:
  push:
    branches:
      - "experiment/move-group-shutdown-order"
      - "experiment/moveit-main-owner-lifetime-only"

permissions:
  contents: read

jobs:
  source-overlay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install workspace tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y git gdb python3-colcon-common-extensions python3-rosdep python3-vcstool
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy

      - name: Fetch and build stock ROS 2 Jazzy rclcpp overlay (no ASan, no source instrumentation)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/rclcpp_ws/src
          git clone --depth 1 --branch jazzy https://github.com/ros2/rclcpp.git /tmp/rclcpp_ws/src/rclcpp
          git -C /tmp/rclcpp_ws/src/rclcpp diff --exit-code
          echo "Using pristine ROS 2 Jazzy rclcpp sources; no Executor, CallbackGroup, NodeBase, or DynamicStorage instrumentation."
          rosdep install --from-paths /tmp/rclcpp_ws/src/rclcpp/rclcpp --ignore-src --rosdistro jazzy -y
          cd /tmp/rclcpp_ws
          colcon build --packages-select rclcpp --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch MoveIt Jazzy source and apply A+K+B-core cleanup probe
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/moveit_ws/src
          git clone --depth 1 --branch jazzy https://github.com/moveit/moveit2.git /tmp/moveit_ws/src/moveit2
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/moveit_ws/src/moveit2/moveit_ros/move_group/src/move_group.cpp")
          source = path.read_text()

          # Fixed K background: stop/join the PSM scene publisher before Context shutdown.
          if source.count("  rclcpp::init(argc, argv);") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::init anchor.")
          if source.count("    executor.spin();") != 1:
              raise SystemExit("Expected exactly one upstream executor.spin anchor.")
          if source.count("    rclcpp::shutdown();") != 1:
              raise SystemExit("Expected exactly one upstream rclcpp::shutdown anchor.")
          if "sigwait(" in source or "SignalHandlerOptions::None" in source:
              raise SystemExit("Unexpected custom signal handling in upstream baseline.")
          source = source.replace(
              "    rclcpp::shutdown();",
              """    RCLCPP_INFO(nh->get_logger(), "shutdown K: stopping PSM scene publisher before Context shutdown");
                  planning_scene_monitor->stopPublishingPlanningScene();
                  RCLCPP_INFO(nh->get_logger(), "shutdown K: PSM scene publisher stopped and joined");
                  rclcpp::shutdown();""",
              1,
          )
          if source.count("planning_scene_monitor->stopPublishingPlanningScene();") != 1:
              raise SystemExit("K PSM publisher stop patch validation failed.")

          # A-PSM-retained: keep the main() PSM alias alive beyond MoveGroupExe/executor scope;
          # continue dropping the main() MoveItCpp and node owners after Context shutdown.
          moveit_cpp_anchor = "  const auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);"
          psm_anchor = "  const auto planning_scene_monitor = moveit_cpp->getPlanningSceneMonitorNonConst();"
          if source.count(moveit_cpp_anchor) != 1 or source.count(psm_anchor) != 1:
              raise SystemExit("Expected unique main() MoveItCpp/PSM owner declarations.")
          source = source.replace(
              moveit_cpp_anchor,
              "  auto moveit_cpp = std::make_shared<moveit_cpp::MoveItCpp>(nh, moveit_cpp_options);",
              1,
          )
          # Keep the PSM alias const and retain its strong owner through the
          # MoveGroupExe/executor block. This weak probe does not add an owner.
          source = source.replace(
              psm_anchor,
              psm_anchor + "\n  const auto planning_scene_monitor_lifetime = std::weak_ptr(planning_scene_monitor);",
              1,
          )
          source = source.replace(
              "    rclcpp::shutdown();",
              """    rclcpp::shutdown();
                  moveit_cpp.reset();
                  nh.reset();""",
              1,
          )
          after_scope_anchor = (
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n"
              "\n"
              "  return 0;"
          )
          after_scope_probe = (
              "  else\n"
              "    RCLCPP_ERROR(nh->get_logger(), \"Planning scene not configured\");\n"
              "\n"
              "  if (planning_scene_monitor_lifetime.expired()) {\n"
              "    std::fprintf(stderr, \"[OWNER] PSM unexpectedly expired before main() return\\\\n\");\n"
              "    std::fflush(stderr);\n"
              "    return 2;\n"
              "  }\n"
              "  std::fprintf(stderr, \"[OWNER] PSM retained after MoveGroupExe/executor scope; use_count=%ld\\\\n\",\n"
              "    planning_scene_monitor_lifetime.use_count());\n"
              "  std::fflush(stderr);\n"
              "\n"
              "  return 0;"
          )
          if source.count(after_scope_anchor) != 1:
              raise SystemExit("Expected exactly one post-MoveGroupExe scope anchor for PSM weak probe.")
          source = source.replace(after_scope_anchor, after_scope_probe, 1)
          if not (
              "planning_scene_monitor.reset();" not in source
              and "moveit_cpp.reset();" in source
              and "nh.reset();" in source
              and "planning_scene_monitor_lifetime.expired()" in source
              and "[OWNER] PSM retained after MoveGroupExe/executor scope" in source
          ):
              raise SystemExit("A-PSM-retained owner treatment / weak-lifetime probe validation failed.")

          # Keep K executor/capability scope order: executor WaitSet is destroyed
          # before MoveGroupExe capability plugins and their loader.
          declaration_order = """    rclcpp::executors::MultiThreadedExecutor executor;

              move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);"""
          reordered_declarations = """    move_group::MoveGroupExe mge(moveit_cpp, default_planning_pipeline, debug);

              rclcpp::executors::MultiThreadedExecutor executor;"""
          if source.count(declaration_order) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe/executor declaration pair.")
          source = source.replace(declaration_order, reordered_declarations, 1)
          if not source.index("move_group::MoveGroupExe mge") < source.index(
              "rclcpp::executors::MultiThreadedExecutor executor"
          ):
              raise SystemExit("K MoveGroupExe/executor scope order validation failed.")

          if "#include <cstdio>" not in source:
              source = source.replace("#include <memory>\n", "#include <cstdio>\n#include <memory>\n", 1)
          move_group_dtor = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    capabilities_.clear();\n"
              "    context_.reset();\n"
              "    capability_plugin_loader_.reset();\n"
              "  }"
          )
          move_group_dtor_marked = (
              "  ~MoveGroupExe()\n"
              "  {\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe dtor BEGIN; capabilities=%zu loader=%d\\n\", "
              "      capabilities_.size(), capability_plugin_loader_ ? 1 : 0);\n"
              "    std::fflush(stderr);\n"
              "    capabilities_.clear();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capabilities_.clear\\n\");\n"
              "    std::fflush(stderr);\n"
              "    context_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after context_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "    capability_plugin_loader_.reset();\n"
              "    std::fprintf(stderr, \"[LIFECYCLE] MoveGroupExe after capability_plugin_loader_.reset\\n\");\n"
              "    std::fflush(stderr);\n"
              "  }"
          )
          if source.count(move_group_dtor) != 1:
              raise SystemExit("Expected exactly one MoveGroupExe destructor anchor.")
          source = source.replace(move_group_dtor, move_group_dtor_marked, 1)
          path.write_text(source)

          # B-core=ON: after stop/cancel/join, release private Executor/WaitSet,
          # controller-manager instance, controller node and loader in this order.
          # Event subscription, parameter callback and event callback group are
          # intentionally NOT reset here; they remain a separate next slice.
          tem_path = Path(
              "/tmp/moveit_ws/src/moveit2/moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp"
          )
          tem_source = tem_path.read_text()
          tem_pattern = (
              r"TrajectoryExecutionManager::~TrajectoryExecutionManager\(\)\n"
              r"\{\n"
              r"  stopExecution\(true\);\n"
              r"  if \(private_executor_\)\n"
              r"    private_executor_->cancel\(\);\n"
              r"  if \(private_executor_thread_\.joinable\(\)\)\n"
              r"    private_executor_thread_\.join\(\);\n"
              r"\}\n"
          )
          tem_replacement = (
              "TrajectoryExecutionManager::~TrajectoryExecutionManager()\n"
              "{\n"
              "  stopExecution(true);\n"
              "  if (private_executor_)\n"
              "    private_executor_->cancel();\n"
              "  if (private_executor_thread_.joinable())\n"
              "    private_executor_thread_.join();\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: private executor reset BEGIN\");\n"
              "  if (private_executor_ && controller_mgr_node_) {\n"
              "    private_executor_->remove_node(controller_mgr_node_);\n"
              "    RCLCPP_INFO(logger_, \"shutdown core-B: private executor node removed\");\n"
              "  }\n"
              "  private_executor_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: private executor reset END\");\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller manager reset BEGIN\");\n"
              "  controller_manager_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller manager reset END\");\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller node reset BEGIN use_count=%ld\", controller_mgr_node_.use_count());\n"
              "  controller_mgr_node_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller node reset END\");\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller-manager loader reset BEGIN\");\n"
              "  controller_manager_loader_.reset();\n"
              "  RCLCPP_INFO(logger_, \"shutdown core-B: controller-manager loader reset END\");\n"
              "}\n"
          )
          tem_source, tem_count = re.subn(tem_pattern, tem_replacement, tem_source, count=1)
          if tem_count != 1:
              raise SystemExit(
                  f"Expected exactly one stock TEM destructor, found {tem_count}; refusing to patch."
              )
          required_core_tokens = (
              "private_executor_->remove_node(controller_mgr_node_);",
              "private_executor_.reset();",
              "controller_manager_.reset();",
              "controller_mgr_node_.reset();",
              "controller_manager_loader_.reset();",
          )
          if any(tem_source.count(token) != 1 for token in required_core_tokens):
              raise SystemExit("B-core teardown tokens must each occur exactly once.")
          ordered_core_tokens = (
              "private_executor_thread_.join();",
              "private_executor_.reset();",
              "controller_manager_.reset();",
              "controller_mgr_node_.reset();",
              "controller_manager_loader_.reset();",
          )
          if not all(tem_source.index(a) < tem_source.index(b) for a, b in zip(ordered_core_tokens, ordered_core_tokens[1:])):
              raise SystemExit("B-core private-executor/manager/node/loader order invalid.")
          if any(token in tem_source for token in (
              "event_topic_subscriber_.reset();",
              "callback_handler_.reset();",
              "event_callback_group_.reset();",
          )):
              raise SystemExit("B-core slice unexpectedly resets event subscription/callback resources.")
          tem_path.write_text(tem_source)

          # This run must use pristine rclcpp: reject the diagnostic-only marker
          # that was intentionally present in Run #130, and is forbidden here.
          dynamic_storage_path = Path(
              "/tmp/rclcpp_ws/src/rclcpp/rclcpp/include/rclcpp/wait_set_policies/dynamic_storage.hpp"
          )
          dynamic_storage_source = dynamic_storage_path.read_text()
          if "WaitSet WeakWaitableEntry dtor BEGIN" in dynamic_storage_source:
              raise SystemExit("Stock rclcpp unexpectedly contains CI lifecycle instrumentation.")

          if not (
              "planning_scene_monitor.reset();" not in source
              and "moveit_cpp.reset();" in source
              and "nh.reset();" in source
              and "planning_scene_monitor_lifetime" in source
              and "private_executor_.reset();" in tem_source
              and "controller_mgr_node_.reset();" in tem_source
              and "controller_manager_loader_.reset();" in tem_source
          ):
              raise SystemExit("A-PSM-retained + K + B-core final static validation failed.")
          print("Applied A-PSM-retained (MoveItCpp/Node owners dropped), fixed K, and B-core cleanup; PSM weak-lifetime probe enabled.")
          PY
          git -C /tmp/moveit_ws/src/moveit2 diff --check
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/move_group/src/move_group.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/src/trajectory_execution_manager.cpp
          git -C /tmp/moveit_ws/src/moveit2 diff -- moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.hpp

      - name: Install MoveIt source dependencies
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          rosdep install --from-paths /tmp/moveit_ws/src/moveit2 --ignore-src --rosdistro jazzy -y

      - name: Build patched MoveIt move_group
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          cd /tmp/moveit_ws
          colcon build --packages-up-to moveit_ros_move_group --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=OFF

      - name: Fetch and build Stäubli mock workspace against patched MoveIt
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          mkdir -p /tmp/staubli_ws/src
          git init /tmp/staubli_ws/src/staubli_driver_ros2
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 remote add origin https://github.com/rexyll/staubli_driver_ros2_from_org.git
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 fetch --depth 1 origin 7d9fa0d715db46060199eeca541514ddeed9c4c1
          git -C /tmp/staubli_ws/src/staubli_driver_ros2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse HEAD)" = "7d9fa0d715db46060199eeca541514ddeed9c4c1"
          test_file="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 ls-files '*test_moveit_mock_planning.launch.py')"
          test_file_count="$(printf '%s\n' "$test_file" | sed '/^$/d' | wc -l)"
          test "$test_file_count" -eq 1
          test_blob="$(git -C /tmp/staubli_ws/src/staubli_driver_ros2 rev-parse "HEAD:$test_file")"
          test "$test_blob" = "2f23d471e2c2dd6ee9e6e5a9560bac88e5cdf14b"
          if grep -Eiq 'SwitchController|deactivate_controllers|switch_controller' "/tmp/staubli_ws/src/staubli_driver_ros2/$test_file"; then
            echo "Unexpected test-side controller-deactivation logic in the PR launch test."
            exit 1
          fi
          echo "Verified PR launch test blob: $test_blob ($test_file); no test-side controller deactivation."
          echo "Verified original PR launch-test blob; adding a separate plan-and-execute test overlay (no controller-deactivation injection)."
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("/tmp/staubli_ws/src/staubli_driver_ros2/staubli_moveit_config/test/test_moveit_mock_planning.launch.py")
          source = test_path.read_text()

          shutdown_anchor = "\n\n@launch_testing.post_shutdown_test()\n"
          method_name = "test_z_move_group_executes_joint_goal_on_mock_controller"
          if source.count(shutdown_anchor) != 1 or method_name in source:
              raise SystemExit("Unexpected launch-test structure; refusing to add execution coverage.")

          method = '''
              def test_z_move_group_executes_joint_goal_on_mock_controller(self):
                  """Run a real MoveGroup plan-and-execute request on mock hardware."""
                  client = ActionClient(self.node, MoveGroup, "/move_action")
                  self.assertTrue(
                      client.wait_for_server(timeout_sec=120.0),
                      "MoveGroup action server did not become available for execution",
                  )

                  goal = MoveGroup.Goal()
                  goal.request.group_name = "arm"
                  goal.request.pipeline_id = "ompl"
                  goal.request.allowed_planning_time = 10.0
                  goal.request.num_planning_attempts = 2
                  goal.request.max_velocity_scaling_factor = 0.5
                  goal.request.max_acceleration_scaling_factor = 0.5
                  goal.request.start_state.is_diff = True

                  constraints = Constraints()
                  target_positions = (0.11, 0.21, 0.31, 0.41, 0.51, 0.61)
                  for index, position in enumerate(target_positions, start=1):
                      joint = JointConstraint()
                      joint.joint_name = f"joint_{index}"
                      joint.position = position
                      joint.tolerance_above = 0.05
                      joint.tolerance_below = 0.05
                      joint.weight = 1.0
                      constraints.joint_constraints.append(joint)
                  goal.request.goal_constraints.append(constraints)

                  goal.planning_options.plan_only = False
                  goal.planning_options.replan = False
                  goal.planning_options.look_around = False

                  send_future = client.send_goal_async(goal)
                  rclpy.spin_until_future_complete(self.node, send_future, timeout_sec=30.0)
                  self.assertTrue(send_future.done(), "MoveGroup execution goal submission timed out")
                  goal_handle = send_future.result()
                  self.assertIsNotNone(goal_handle)
                  self.assertTrue(goal_handle.accepted, "MoveGroup rejected the execution goal")

                  result_future = goal_handle.get_result_async()
                  rclpy.spin_until_future_complete(self.node, result_future, timeout_sec=120.0)
                  self.assertTrue(result_future.done(), "MoveGroup execution result timed out")
                  result = result_future.result().result
                  self.assertEqual(result.error_code.val, MoveItErrorCodes.SUCCESS)
                  self.assertTrue(
                      result.planned_trajectory.joint_trajectory.points,
                      "MoveIt did not return the planned trajectory",
                  )
          '''

          source = source.replace(
              shutdown_anchor,
              "\n\n" + method + shutdown_anchor,
              1,
          )
          test_path.write_text(source)
          print("Added isolated plan_only=False execution coverage after the original PR blob SHA check.")
          PY
          rosdep install --from-paths /tmp/staubli_ws/src --ignore-src --rosdistro jazzy -y
          cd /tmp/staubli_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer' -DBUILD_TESTING=ON

      - name: Run uninstrumented A-PSM-retained + K + B-core mock teardown regression (10 repetitions)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/rclcpp_ws/install/setup.bash
          source /tmp/moveit_ws/install/setup.bash
          source /tmp/staubli_ws/install/setup.bash
          unset LD_PRELOAD ASAN_OPTIONS
          cd /tmp/staubli_ws
          package_prefix="$(ros2 pkg prefix staubli_moveit_config)"
          test -d "$package_prefix"
          colcon list --base-paths src | awk '{print $1}' | grep -Fx "staubli_moveit_config"
          git -C /tmp/rclcpp_ws/src/rclcpp diff --exit-code
          if grep -R -E 'WaitSet WeakWaitableEntry dtor BEGIN|CallbackGroup dtor BEGIN|NodeBase dtor BEGIN|Executor dtor body BEGIN' /tmp/rclcpp_ws/src/rclcpp/rclcpp; then
            echo "Unexpected CI lifecycle instrumentation remains in rclcpp source."
            exit 1
          fi
          echo "Test workspace preflight passed: package=staubli_moveit_config prefix=$package_prefix; rclcpp source pristine."
          echo "Running A-PSM-retained treatment with stock rclcpp runtime semantics."
          failures=0
          for iteration in $(seq 1 10); do
            echo "=== A-PSM-retained + K + B-core clean repetition $iteration/10 ==="
            output_log="/tmp/staubli_ws/a-psm-retained-k-b-core-clean-$iteration.log"
            set +e
            colcon test --packages-select staubli_moveit_config --event-handlers console_direct+ --return-code-on-test-failure 2>&1 | tee "$output_log"
            test_rc=$?
            set -e
            set +e
            colcon test-result --verbose 2>&1 | tee -a "$output_log"
            result_rc=$?
            set -e
            set +e
            python3 - "$output_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          markers = [
              "shutdown core-B: private executor reset BEGIN",
              "shutdown core-B: private executor node removed",
              "shutdown core-B: private executor reset END",
              "shutdown core-B: controller manager reset BEGIN",
              "shutdown core-B: controller manager reset END",
              "shutdown core-B: controller node reset BEGIN use_count=1",
              "shutdown core-B: controller node reset END",
              "shutdown core-B: controller-manager loader reset BEGIN",
              "shutdown core-B: controller-manager loader reset END",
          ]
          positions = []
          for marker in markers:
              found = next((i for i, line in enumerate(lines) if marker in line), None)
              if found is None:
                  raise SystemExit(f"Missing lifecycle marker: {marker}")
              positions.append(found)
          if positions != sorted(positions):
              raise SystemExit(f"B-core teardown markers out of order: {positions}")

          action_successes = sum(
              "Completed trajectory execution with status SUCCEEDED" in line
              for line in lines
          )
          if action_successes != 1:
              raise SystemExit(f"Expected exactly one successful mock execution, observed {action_successes}")
          launch_tests = sum("Ran 1 test in" in line for line in lines)
          if launch_tests != 1:
              raise SystemExit(f"Expected one launch test execution, observed {launch_tests}")
          passing_summaries = sum(
              "Summary: 7 tests, 0 errors, 0 failures, 0 skipped" in line
              for line in lines
          )
          if passing_summaries != 1:
              raise SystemExit(f"Expected one clean 7-test summary, observed {passing_summaries}")
          psm_retained = [
              line for line in lines
              if "[OWNER] PSM retained after MoveGroupExe/executor scope" in line
          ]
          if len(psm_retained) != 1:
              raise SystemExit(f"Expected exactly one PSM-retained weak-owner marker, observed {len(psm_retained)}")
          if not any("use_count=" in line for line in psm_retained):
              raise SystemExit("PSM-retained marker did not report weak_ptr use_count.")

          if any(
              "Segmentation fault" in line or "exit code -11" in line
              for line in lines
          ):
              raise SystemExit("Detected a segmentation fault or SIGSEGV exit.")
          if any(
              "test_all_processes_exit_cleanly" in lines[i] and "FAIL" in lines[i]
              for i in range(len(lines))
          ):
              raise SystemExit("Post-shutdown process-exit assertion failed.")
          print(
              "Uninstrumented A-PSM-retained / B-core order verified; one mock execution succeeded; "
              "one launch test and all seven test assertions passed."
          )
          PY
            order_rc=$?
            set -e
            echo "=== A-PSM-retained repetition $iteration/10 exit summary: colcon_test=$test_rc, test_result=$result_rc, lifecycle_order=$order_rc ==="
            if [ "$test_rc" -ne 0 ] || [ "$result_rc" -ne 0 ] || [ "$order_rc" -ne 0 ]; then
              failures=$((failures + 1))
              echo "Clean repetition $iteration/10 failed acceptance."
            fi
          done
          echo "=== A-PSM-retained + K + B-core uninstrumented complete: failures=$failures/10 ==="
          test "$failures" -eq 0

      - name: Preserve experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moveit-shutdown-order-experiment-logs
          path: |
            /tmp/rclcpp_ws/log
            /tmp/moveit_ws/log
            /tmp/staubli_ws/log
            /tmp/staubli_ws/k-only-pruning-*.log
            /tmp/staubli_ws/a-k-b-core-*.log
            /tmp/staubli_ws/a-psm-retained-k-b-core-clean-*.log
          if-no-files-found: ignore
